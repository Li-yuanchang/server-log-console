<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fdfefe"/>
      <stop offset="100%" stop-color="#eef3f9"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="shadow" x="-6%" y="-4%" width="112%" height="114%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0f2033" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- macOS icon: 824x824 squircle centered in 1024x1024, transparent outside -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#0f2033" stroke-opacity="0.06" stroke-width="3"/>
  <!-- log rows: severity dot + message bar -->
  <circle cx="310" cy="316" r="25" fill="#2fb87b"/>
  <rect x="363" y="291" width="376" height="50" rx="25" fill="#26384c" opacity="0.34"/>
  <circle cx="310" cy="424" r="25" fill="#e0a020"/>
  <rect x="363" y="399" width="304" height="50" rx="25" fill="#26384c" opacity="0.24"/>
  <circle cx="310" cy="532" r="25" fill="#e05f5f"/>
  <rect x="363" y="507" width="340" height="50" rx="25" fill="#26384c" opacity="0.28"/>
  <!-- active prompt line: chevron + cursor -->
  <path d="M322 600 L408 650 L322 700" stroke="#1b2b3d" stroke-width="54" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="452" y="623" width="128" height="54" rx="16" fill="#2f9fe0"/>
</svg>
