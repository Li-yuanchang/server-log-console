<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日志控制台</title>
    <script type="module" src="./src/main.tsx"></script>
    <style>
      /* 侧栏形态首屏骨架：几何对齐 body.extension-sidepanel 真实布局
         （双档容器查询，档位常量同 styles-sidepanel.css：≥560 宽档 =
         侧栏 172px + 主区；<560 移动档 = app bar + 内容 + 底部 tab 条）。
         #app-loading 为 sk-sp 查询容器，宽档显示 #sk-side+#sk-main，
         移动档改显自包含的 #sk-mobile（消除挂载跳变）。
         注意：MV3 CSP script-src 'self' 禁内联脚本，故不做 index.html 那套
         localStorage 主题跟随，骨架固定浅色（React 挂载后由应用接管）。
         #app-loading 由 App.tsx 挂载 effect 淡出移除（与 index.html 同一约定）。 */
      html,body,#root{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:#fafafa}
      #app-loading{
        --sk-bg:#fafafa;--sk-panel:#ffffff;--sk-muted:#f2f2f2;--sk-line:#eaeaea;
        --sk-ink:#171717;--sk-ink-muted:#8f8f8f;--sk-ink-soft:#666666;--sk-accent:#3b6b5a;
        position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
        background:var(--sk-bg);color:var(--sk-ink-muted);
        font-family:-apple-system,BlinkMacSystemFont,'Geist Sans','PingFang SC',sans-serif;
        transition:opacity .25s ease;
      }
      /* 2026-11-02 chrome v1 统一：启动画面 = logo 三行日志行徽标 + 波纹双环（同 index.html），
         骨架屏退役；徽标即唯一动效源，accent 对齐真实基础主题（暖墨绿）。 */
      .splash{display:flex;flex-direction:column;align-items:center;text-align:center}
      .splash .lg-rip{margin-bottom:14px}
      .lg-rip{position:relative;display:block}
      .lg-mark{position:relative;width:56px;height:56px;border-radius:22.5%;
        background:linear-gradient(160deg,var(--sk-panel) 0%,var(--sk-bg) 100%);
        border:1px solid var(--sk-line);box-shadow:0 6px 18px rgba(15,32,51,.12);
        display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 13px}
      .lg-row{display:flex;align-items:center;gap:4px;height:5px;animation:lg-row 1.8s ease-in-out infinite}
      .lg-row:nth-child(2){animation-delay:.25s}
      .lg-row:nth-child(3){animation-delay:.5s}
      @keyframes lg-row{0%,100%{opacity:.4}50%{opacity:1}}
      .lg-dot{width:5px;height:5px;border-radius:999px;flex:none}
      .lg-dot-g{background:#2fb87b}.lg-dot-a{background:#e0a020}.lg-dot-r{background:#e05f5f}
      .lg-bar{display:block;height:5px;border-radius:999px;background:color-mix(in srgb,var(--sk-ink) 24%,transparent)}
      .lg-ring{position:absolute;inset:-2px;border-radius:22.5%;border:1.5px solid color-mix(in srgb,var(--sk-accent) 32%,transparent);animation:lg-ripple 2.6s ease-out infinite;pointer-events:none}
      .lg-ring-2{animation-delay:1.3s}
      @keyframes lg-ripple{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.42);opacity:0}}
      @media (prefers-reduced-motion:reduce){.lg-row,.lg-ring{animation:none}}
      .splash-word{font-size:15px;font-weight:650;letter-spacing:-.01em;color:var(--sk-ink)}
      .splash-sub{margin-top:2px;font-size:10.5px;font-family:'Geist Mono',ui-monospace,monospace;letter-spacing:.08em;color:var(--sk-ink-muted)}
      .splash-status{margin-top:18px;font-size:12px;color:var(--sk-ink-muted)}
    </style>
  </head>
  <body class="extension-sidepanel">
    <div id="app-loading">
      <div class="splash">
        <span class="lg-rip" aria-hidden="true">
          <span class="lg-mark">
            <span class="lg-row"><i class="lg-dot lg-dot-g"></i><i class="lg-bar" style="width:64%"></i></span>
            <span class="lg-row"><i class="lg-dot lg-dot-a"></i><i class="lg-bar" style="width:46%"></i></span>
            <span class="lg-row"><i class="lg-dot lg-dot-r"></i><i class="lg-bar" style="width:55%"></i></span>
          </span>
          <i class="lg-ring"></i>
          <i class="lg-ring lg-ring-2"></i>
        </span>
        <div class="splash-word">日志控制台</div>
        <div class="splash-sub">SERVER LOG CONSOLE</div>
        <div class="splash-status">正在连接服务…</div>
      </div>
    </div>
    <div id="root"></div>
  </body>
</html>
