<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4066"/>
      <stop offset="55%" stop-color="#123055"/>
      <stop offset="100%" stop-color="#0a1c36"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.75">
      <stop offset="0%" stop-color="#5ec8ff" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#5ec8ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#5ec8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7de5ff"/>
      <stop offset="100%" stop-color="#2fa8e8"/>
    </linearGradient>
    <linearGradient id="chev" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfeeff"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="shadow" x="-6%" y="-4%" width="112%" height="114%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon: 824x824 squircle centered in 1024x1024, transparent outside -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <!-- log rows: severity dot + message bar -->
  <circle cx="310" cy="316" r="25" fill="#3ed598"/>
  <rect x="363" y="291" width="376" height="50" rx="25" fill="#d9e9fc" opacity="0.52"/>
  <circle cx="310" cy="424" r="25" fill="#ffc14d"/>
  <rect x="363" y="399" width="304" height="50" rx="25" fill="#d9e9fc" opacity="0.40"/>
  <circle cx="310" cy="532" r="25" fill="#ff7373"/>
  <rect x="363" y="507" width="340" height="50" rx="25" fill="#d9e9fc" opacity="0.46"/>
  <!-- active prompt line: chevron + cursor -->
  <path d="M322 600 L408 650 L322 700" stroke="url(#chev)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="452" y="623" width="128" height="54" rx="16" fill="url(#accent)"/>
</svg>
