<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f2033"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60d5f7"/>
      <stop offset="100%" stop-color="#34a5e5"/>
    </linearGradient>
    <linearGradient id="chevron" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c8ecfc"/>
    </linearGradient>
    <!-- macOS icon drop shadow -->
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- macOS icon: 824x824 squircle centered in 1024x1024, transparent outside -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Terminal chevron > -->
  <path d="M310 390 L480 512 L310 634" stroke="url(#chevron)" stroke-width="68" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Cursor block -->
  <rect x="548" y="476" width="220" height="72" rx="14" fill="url(#accent)"/>
</svg>
