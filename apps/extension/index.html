<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日志控制台</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/style.min.css" />
    <script type="module" src="./src/main.tsx"></script>
  </head>
  <body style="margin:0;background:#e3e7eb;min-height:100vh;overflow:hidden">
    <div id="app-loading" style="position:fixed;inset:0;z-index:9999;display:flex;background:#e3e7eb;font-family:-apple-system,BlinkMacSystemFont,'Geist Sans','PingFang SC',sans-serif;transition:opacity .25s ease">
      <!-- Skeleton: sidebar -->
      <div id="sk-side" style="width:260px;min-width:260px;background:#f2f4f6;border-right:1px solid #d5dbe2;padding:12px;display:flex;flex-direction:column;gap:10px">
        <div style="height:32px;border-radius:6px;background:#e3e7eb"></div>
        <div style="height:28px;border-radius:6px;background:#e8ebef;width:70%"></div>
        <div style="flex:1"></div>
        <div style="height:20px;border-radius:4px;background:#e3e7eb;width:60%;opacity:.5"></div>
      </div>
      <!-- Skeleton: main area -->
      <div style="flex:1;display:flex;flex-direction:column">
        <!-- Toolbar -->
        <div id="sk-toolbar" style="height:auto;background:#f2f4f6;border-bottom:1px solid #d5dbe2;display:flex;align-items:center;padding:8px 16px;gap:8px">
      <script>if(/Electron/.test(navigator.userAgent)){document.getElementById('sk-side').style.paddingTop='38px';document.getElementById('app-loading').style.paddingTop='0'}</script>
          <div style="height:28px;width:120px;border-radius:6px;background:#e3e7eb"></div>
          <div style="height:28px;width:80px;border-radius:6px;background:#e8ebef"></div>
          <div style="flex:1"></div>
          <div style="height:28px;width:28px;border-radius:6px;background:#e3e7eb"></div>
        </div>
        <!-- Content -->
        <div style="flex:1;display:flex;align-items:center;justify-content:center;color:#8b95a3;font-size:13px;letter-spacing:.3px">
          正在连接服务…
        </div>
        <!-- Status bar -->
        <div style="height:28px;background:#f2f4f6;border-top:1px solid #d5dbe2;display:flex;align-items:center;padding:0 12px">
          <div style="height:12px;width:100px;border-radius:3px;background:#e3e7eb"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
  </body>
</html>
