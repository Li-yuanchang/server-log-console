<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日志控制台</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      window.__SLC_PIP_MODE__=new URLSearchParams(location.search).get('pip')||'';
      document.documentElement.dataset.slcPip=window.__SLC_PIP_MODE__?'1':'0';
      document.documentElement.dataset.slcElectron=/Electron/.test(navigator.userAgent)?'1':'0';
      /* 开发预览：URL 带 ?splash 参数时启动页不淡出（仅预览用，正常入口不受影响） */
      window.__SLC_HOLD_SPLASH__=new URLSearchParams(location.search).has('splash');
      /* 启动页出场时刻：App 挂载后保证最短展示时长（见 App.tsx MIN_SPLASH_MS），
         避免本地服务就绪过快时品牌启动页只闪一下 */
      window.__SLC_SPLASH_SHOWN_AT__=Date.now();
      /* 首屏底色跟随主题（ui-theme-preset/ui-tone-mode 与 useUiTheme 同键名）。
         8 套主题的 bg 色表与 useUiTheme THEME_PRESETS 一致；toneMode=system 时
         读 prefers-color-scheme 在同族内取变体。 */
      try{
        var __slcBg={'geist':'#fafafa','carbon':'#0a0a0a','steel':'#f6f8fa','slate':'#0b1220','sand':'#faf9f7','espresso':'#1c1917','cal':'#ffffff','ink':'#09090b','sage':'#f5f6f2','graphite':'#171a19'};
        var __slcFam={geist:'neutral',carbon:'neutral',steel:'cool',slate:'cool',sand:'warm',espresso:'warm',cal:'mono',ink:'mono',sage:'sage',graphite:'sage'};
        var __slcPair={neutral:['geist','carbon'],cool:['steel','slate'],warm:['sand','espresso'],mono:['cal','ink'],sage:['sage','graphite']};
        var __slcPreset=localStorage.getItem('ui-theme-preset')||'geist';
        if(!__slcBg[__slcPreset])__slcPreset='geist';
        var __slcTone=localStorage.getItem('ui-tone-mode')||'system';
        var __slcDark=__slcTone==='dark'||(__slcTone==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
        var __slcId=__slcTone==='light'?__slcPair[__slcFam[__slcPreset]][0]:__slcTone==='dark'?__slcPair[__slcFam[__slcPreset]][1]:(__slcDark?__slcPair[__slcFam[__slcPreset]][1]:__slcPair[__slcFam[__slcPreset]][0]);
        document.documentElement.dataset.skTheme=__slcId;
        document.documentElement.style.background=__slcBg[__slcId];
      }catch(e){}
    </script>
    <style>
      html,body,#root{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:transparent}
      html[data-slc-pip="1"],html[data-slc-pip="1"] body,html[data-slc-pip="1"] #root{background:#0a0a0a}
      /* 启动页（2026-10-04 重设计，原型 docs/prototypes/loading-splash-v1.html）：
         品牌居中 splash，与宽度无关 —— 旧版模拟「侧栏 + 工具栏」的骨架布局在
         窄容器（sidepanel 单列）下是幻觉布局，已被移除。
         品牌图形 = icon.svg（与应用图标同源）；文案/几何走主题令牌。 */
      #app-loading{
        --sk-bg:#fafafa;--sk-panel:#ffffff;--sk-muted:#f2f2f2;--sk-line:#eaeaea;
        --sk-ink:#171717;--sk-ink-muted:#8f8f8f;--sk-ink-soft:#666666;--sk-accent:#0070f3;
        position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
        background:var(--sk-bg);color:var(--sk-ink-muted);
        font-family:-apple-system,BlinkMacSystemFont,'Geist Sans','PingFang SC',sans-serif;
        transition:opacity .25s ease;
      }
      html[data-sk-surface="mist"] #app-loading{
        --sk-bg:#eef5f7;--sk-panel:rgba(248,252,253,.94);--sk-muted:#e7eff3;
        --sk-line:rgba(49,95,141,.16);--sk-ink-soft:#4f6a80;--sk-ink-muted:#7d95a8;
      }
      html[data-sk-surface="paper"] #app-loading{
        --sk-bg:#f4efe4;--sk-panel:rgba(255,252,244,.94);--sk-muted:#ece3d2;
        --sk-line:rgba(120,88,48,.16);--sk-ink-soft:#6d5a3d;--sk-ink-muted:#9c8a6b;
      }
      .splash{display:flex;flex-direction:column;align-items:center;text-align:center;animation:splash-in .45s cubic-bezier(.2,.7,.3,1)}
      @keyframes splash-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){.splash{animation:none}}
      /* 统一 logo 加载语言：icon.svg 的「severity 点 + 消息条」三行日志行徽标 + 波纹双环
         （定稿 docs/prototypes/log-preview-empty-v4-2026-11.html L1.0；无 spinner，徽标即唯一动效源） */
      .lg-rip{position:relative;display:block}
      .lg-mark{position:relative;width:56px;height:56px;border-radius:22.5%;
        background:linear-gradient(160deg,var(--sk-panel) 0%,var(--sk-bg) 100%);
        border:1px solid var(--sk-line);box-shadow:0 6px 18px rgba(15,32,51,.12);
        display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 13px}
      .lg-row{display:flex;align-items:center;gap:4px;height:5px;animation:lg-row 1.8s ease-in-out infinite}
      .lg-row:nth-child(2){animation-delay:.25s}
      .lg-row:nth-child(3){animation-delay:.5s}
      @keyframes lg-row{0%,100%{opacity:.4}50%{opacity:1}}
      .lg-dot{width:5px;height:5px;border-radius:999px;flex:none}
      .lg-dot-g{background:#2fb87b}.lg-dot-a{background:#e0a020}.lg-dot-r{background:#e05f5f}
      .lg-bar{display:block;height:5px;border-radius:999px;background:color-mix(in srgb,var(--sk-ink) 24%,transparent)}
      .lg-ring{position:absolute;inset:-2px;border-radius:22.5%;border:1.5px solid color-mix(in srgb,var(--sk-accent) 32%,transparent);animation:lg-ripple 2.6s ease-out infinite;pointer-events:none}
      .lg-ring-2{animation-delay:1.3s}
      @keyframes lg-ripple{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.42);opacity:0}}
      @media (prefers-reduced-motion:reduce){.lg-row,.lg-ring{animation:none}}
      .splash .lg-rip{margin-bottom:14px}
      .splash-word{font-size:15px;font-weight:650;letter-spacing:-.01em;color:var(--sk-ink)}
      .splash-sub{margin-top:2px;font-size:10.5px;font-family:'Geist Mono',ui-monospace,monospace;letter-spacing:.08em;color:var(--sk-ink-muted)}
      .splash-status{margin-top:18px;font-size:12px;color:var(--sk-ink-muted)}
      html[data-slc-electron="1"] .splash{transform:translateY(14px)}
      html[data-slc-pip="1"] #app-loading{--sk-bg:#0a0a0a;--sk-panel:#111111;--sk-muted:rgba(126,200,227,.14);--sk-line:rgba(126,200,227,.08);--sk-ink:rgba(255,255,255,.92);--sk-ink-soft:rgba(195,208,224,.72);--sk-ink-muted:rgba(195,208,224,.6);--sk-accent:#7ec8e3}
    </style>
    <script type="module" src="./src/main.tsx"></script>
  </head>
  <body>
    <div id="app-loading">
      <div class="splash">
        <span class="lg-rip" aria-hidden="true">
          <span class="lg-mark">
            <span class="lg-row"><i class="lg-dot lg-dot-g"></i><i class="lg-bar" style="width:64%"></i></span>
            <span class="lg-row"><i class="lg-dot lg-dot-a"></i><i class="lg-bar" style="width:46%"></i></span>
            <span class="lg-row"><i class="lg-dot lg-dot-r"></i><i class="lg-bar" style="width:55%"></i></span>
          </span>
          <i class="lg-ring"></i>
          <i class="lg-ring lg-ring-2"></i>
        </span>
        <div class="splash-word">日志控制台</div>
        <div class="splash-sub">SERVER LOG CONSOLE</div>
        <div class="splash-status">正在连接服务…</div>
      </div>
    </div>
    <div id="root"></div>
  </body>
</html>
