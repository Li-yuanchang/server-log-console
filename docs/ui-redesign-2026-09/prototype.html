<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Server Log Console — UI 重设计 · 高保真原型</title>
<style>
:root {
  --panel:#ffffff; --panel-muted:#f5f5f5; --bg:#fafafa;
  --ink:#171717; --ink-soft:#666666; --ink-muted:#8f8f8f;
  --line:#eaeaea; --line-strong:#d4d4d4;
  --accent:#0070f3; --accent-h:#0060df; --accent-soft:rgba(0,112,243,.08);
  --green:#0a7b3e; --green-dot:#22c55e; --red:#d41313; --red-soft:rgba(212,19,19,.07);
  --amber:#b45309; --amber-soft:rgba(180,83,9,.09);
  --shell:#0a0a0a; --shell-ink:#d7dde5; --shell-mut:#5c6b7a;
  --r-s:6px; --r-m:8px; --r-l:10px;
  --mono:"Geist Mono","SFMono-Regular","Menlo","Consolas",monospace;
  --font:"Geist","Inter",-apple-system,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --shadow-pop:0 12px 40px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);letter-spacing:-.01em;font-size:12.5px;color:var(--ink);background:var(--bg);display:flex;overflow:hidden}
svg{display:block;flex:none}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;letter-spacing:inherit}

/* ---------- 屏索引 ---------- */
#index{flex:0 0 178px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;padding:10px 8px;gap:1px;overflow-y:auto}
#index h1{font-size:12px;font-weight:700;padding:6px 8px 10px}
#index button{display:flex;align-items:center;gap:8px;padding:6px 9px;font-size:12px;color:var(--ink-soft);text-align:left;border-radius:var(--r-s)}
#index button:hover{background:var(--panel-muted);color:var(--ink)}
#index button.on{background:var(--ink);color:#fff;font-weight:600}
#index .sid{font-family:var(--mono);font-size:9.5px;opacity:.6;width:18px}
#index .foot{margin-top:auto;padding:10px 8px;font-size:10px;color:var(--ink-muted);line-height:1.7;border-top:1px dashed var(--line)}
#index .foot b{color:var(--ink-soft)}

/* ---------- 舞台 ---------- */
#stage{flex:1;display:flex;flex-direction:column;min-width:0}
#desc{flex:none;display:flex;align-items:baseline;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
#desc .n{font-weight:700;font-size:13.5px}
#desc .d{font-size:11.5px;color:var(--ink-muted)}
#viewport{flex:1;position:relative;overflow:hidden;background:var(--panel)}
.screen{display:none;position:absolute;inset:0}
.screen.on{display:flex}

/* ---------- 设计系统 ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;font-size:12px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--panel);color:var(--ink);transition:background .12s,border-color .12s;white-space:nowrap}
.btn:hover{background:var(--panel-muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:550}
.btn.pri:hover{background:var(--accent-h)}
.btn.danger{color:var(--red)}
.btn.icon{width:28px;padding:0;justify-content:center}
.btn.sm{height:24px;padding:0 8px;font-size:11px;border-radius:5px}
.btn[disabled]{opacity:.45;cursor:default}
.btn .spinner{width:11px;height:11px;border:1.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.input{height:28px;padding:0 10px;font-size:12.5px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--panel);color:var(--ink);outline:none;transition:border-color .12s,box-shadow .12s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.input::placeholder{color:var(--ink-muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;background:var(--panel)}
.seg>button{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:28px;padding:0 11px;font-size:12px;color:var(--ink-soft);border-right:1px solid var(--line);white-space:nowrap}
.seg>button:last-child{border-right:none}
.seg>button.on{background:var(--ink);color:#fff;font-weight:600}
.seg.lite>button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--ink-muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.chip.grn{color:var(--green);border-color:color-mix(in srgb,var(--green) 32%,transparent);background:color-mix(in srgb,var(--green) 6%,transparent)}
.chip.red{color:var(--red);border-color:color-mix(in srgb,var(--red) 30%,transparent)}
.chip.amb{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 30%,transparent)}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 11px;font-size:11.5px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);white-space:nowrap}
.pill.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:550}
.fchip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 11px;font-size:11.5px;border:1px solid var(--line);border-radius:999px;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.fchip:hover{border-color:var(--line-strong);color:var(--ink)}
.fchip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:550}
.fchip .n{font-weight:650}
.fchip.red .n{color:var(--red)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.on{background:var(--green-dot);box-shadow:0 0 0 3px rgba(34,197,94,.15)}
.dot.off{background:#c8ccd2;box-shadow:0 0 0 3px rgba(0,0,0,.05)}
.marq{overflow:hidden;white-space:nowrap;display:flex;min-width:0}
.marq>span{display:inline-block;padding-right:28px;animation:marq 9s linear infinite}
@keyframes marq{0%,10%{transform:translateX(0)}90%,100%{transform:translateX(-50%)}}
.kbd{font-family:var(--mono);font-size:9.5px;color:var(--ink-soft);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 4px;line-height:14px}
.mut{color:var(--ink-muted)}.soft{color:var(--ink-soft)}
.mono{font-family:var(--mono)}
.hr{height:1px;background:var(--line)}

/* ---------- 应用框架 ---------- */
.app{display:flex;height:100%;width:100%}
.sidebar{flex:0 0 240px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel);min-height:0}
.workspace{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.wtabs{display:flex;align-items:center;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);flex:none}
.wtab{display:flex;align-items:center;gap:6px;height:34px;padding:0 13px;font-size:12px;color:var(--ink-soft);border-bottom:2px solid transparent}
.wtab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.tbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex:none}
.content{flex:1;min-height:0;position:relative;overflow:auto}

/* 侧栏行 */
.srow{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px 0 14px;cursor:pointer}
.srow:hover{background:color-mix(in srgb,var(--ink) 3.5%,transparent)}
.srow.cur{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.srow .meta{flex:1;min-width:0}
.srow .nm{display:flex;align-items:center;gap:6px;font-weight:550;font-size:12.5px;white-space:nowrap;overflow:hidden}
.srow .nm .x{color:var(--ink-muted);font-weight:500}
.srow .host{font-family:var(--mono);font-size:10px;color:var(--ink-muted)}
.srow .port{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.srow .qa{display:none;gap:2px}
.srow.hov .qa{display:flex}
.srow.hov .port{display:none}
.grp{display:flex;align-items:center;gap:6px;padding:12px 14px 4px;font-size:10.5px;font-weight:600;color:var(--ink-muted)}
.grp .c{color:var(--line-strong);font-weight:500}
.qa .btn{border-color:transparent;background:transparent;color:var(--ink-muted)}
.qa .btn:hover{border-color:var(--line);background:var(--panel);color:var(--ink)}
.side-foot{border-top:1px solid var(--line);padding:7px 14px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-soft);cursor:pointer}
.side-foot:hover{background:var(--panel-muted)}
.side-foot .sum{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot .mono{font-size:10px}

/* 日志 */
.ll{display:flex;padding:1px 14px;font-family:var(--mono);font-size:11px;line-height:1.65;color:var(--ink-soft);white-space:nowrap}
.ll .t{color:var(--ink-muted);flex:0 0 148px}
.ll.e .lv{color:var(--red);font-weight:650}
.ll.w .lv{color:var(--amber);font-weight:600}
.ll.hit{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.ll.cur{background:color-mix(in srgb,var(--accent) 15%,transparent);box-shadow:inset 2px 0 0 var(--accent)}
.ll mark{background:transparent;color:var(--accent);font-weight:650;text-decoration:underline;text-underline-offset:2px}
.rtools{display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--ink-soft);flex:none;background:var(--panel)}
.rtools .stat b{color:var(--ink);font-weight:650}
.liveb{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--red);border:1px solid color-mix(in srgb,var(--red) 32%,transparent);border-radius:999px;padding:1px 9px}
.liveb i{width:6px;height:6px;border-radius:50%;background:var(--red);animation:pl 1.4s infinite}
.liveb.retry{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 35%,transparent)}
.liveb.retry i{background:var(--amber);animation:spin 1s linear infinite}
@keyframes pl{50%{opacity:.3}}

/* 切片条 */
.slicebar{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);flex:none}
.strack{flex:1;height:5px;border-radius:3px;background:var(--panel-muted);position:relative}
.strack .fill{position:absolute;left:0;top:0;bottom:0;width:62%;background:color-mix(in srgb,var(--accent) 25%,transparent);border-radius:3px}
.strack .thumb{position:absolute;top:-4px;left:62%;width:9px;height:13px;background:var(--accent);border-radius:3px;box-shadow:0 1px 4px rgba(0,112,243,.4)}

/* 抽屉 */
.drawer{position:absolute;top:0;right:0;bottom:0;width:420px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:20;animation:din .18s ease}
@keyframes din{from{transform:translateX(24px);opacity:0}}
.dhead{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);flex:none;min-width:0}
.dhead .t{overflow:hidden;text-overflow:ellipsis}
.dhead .seg{flex:none;max-width:60%}
.dhead .seg>button{padding:0 9px}
.dhead .t{font-weight:700;font-size:13px;flex:1}
.dbody{flex:1;overflow-y:auto;min-height:0}
.dfoot{display:flex;align-items:center;gap:8px;padding:9px 16px;border-top:1px solid var(--line);flex:none}

/* 表格 */
table.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{position:sticky;top:0;text-align:left;font-size:11px;font-weight:600;color:var(--ink-soft);padding:6px 12px;background:var(--panel-muted);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:4px 12px;height:30px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr.sel td{background:var(--accent-soft)}
.tbl tr:hover td{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.tbl tr.sel:hover td{background:var(--accent-soft)}
.batchbar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--accent-soft);border-bottom:1px solid color-mix(in srgb,var(--accent) 22%,transparent);font-size:12px}

/* 终端 */
.term{flex:1;background:var(--shell);color:var(--shell-ink);font-family:var(--mono);font-size:11px;line-height:1.8;padding:12px 16px;overflow:hidden;min-width:0}
.term .p{color:#7ec8e3}.term .ok{color:#98c379}.term .dim{color:var(--shell-mut)}
.cursor{display:inline-block;width:7px;height:14px;background:#ededed;vertical-align:-2px;animation:pl 1s steps(1) infinite}

/* 菜单 */
.menu{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow-pop);padding:5px;min-width:180px;font-size:12.5px}
.menu .mi{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:5px}
.menu .mi:hover{background:var(--panel-muted)}
.menu .mi .k{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-muted)}
.menu .sep{height:1px;background:var(--line);margin:4px 6px}
.menu .danger{color:var(--red)}

/* 命令面板 */
.palette{position:absolute;inset:0;z-index:40;background:rgba(23,23,23,.28);display:flex;justify-content:center;padding-top:110px}
.palette .box{width:560px;height:fit-content;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.22);overflow:hidden}
.palette .pi{display:flex;align-items:center;gap:8px;margin:12px;position:relative}
.palette .pi input{flex:1;height:38px;padding-left:34px;font-size:13.5px;border-radius:8px}
.palette .pi svg{position:absolute;left:11px;color:var(--ink-muted)}
.palette .list{max-height:320px;overflow:auto;padding:0 8px 8px}
.palette .it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font-size:12.5px}
.palette .it.sel{background:var(--accent-soft)}
.palette .it .k{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--ink-muted)}
.palette .cap{padding:8px 10px 2px;font-size:10px;font-weight:650;color:var(--ink-muted);letter-spacing:.06em}

/* 决策条 */
.decision{position:absolute;left:0;right:0;bottom:0;z-index:30;border-top:1px dashed var(--line-strong);background:rgba(255,255,255,.97);padding:8px 18px;font-size:11px;line-height:1.75;color:var(--ink-soft)}
.decision b{color:var(--accent);font-weight:650}
.decision .w{color:var(--ink);font-weight:600}


/* 文件名单元格：单行不换行 */
.tbl .f{display:inline-flex;align-items:center;gap:7px;max-width:100%;white-space:nowrap;min-width:0}
.tbl .f .fnm{overflow:hidden;text-overflow:ellipsis}
.tbl .f svg{color:var(--ink-muted)}
.tbl tr:hover .rops{display:flex}
.rops{display:none;gap:2px}
/* 完整目录树 */
.tree{padding:6px 4px}
.tree .trow{display:flex;align-items:center;gap:5px;height:27px;padding-right:8px;cursor:pointer;border-radius:6px;white-space:nowrap}
.tree .trow:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.tree .trow.on{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.tree .tw{width:13px;color:var(--ink-muted);flex:none;display:flex}
.tree .tn{font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.tree .tc{font-size:10px;color:var(--ink-muted);margin-left:auto;font-family:var(--mono)}

/* 传输 */
.xfer{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line)}
.xfer .ic{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex:none}
.xfer .ic.up{background:var(--accent-soft);color:var(--accent)}
.xfer .ic.dn{background:color-mix(in srgb,var(--green) 8%,transparent);color:var(--green)}
.xfer .ic.err{background:var(--red-soft);color:var(--red)}
.xfer .meta{flex:1;min-width:0}
.xfer .fn{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xfer .sub{font-family:var(--mono);font-size:10px;color:var(--ink-muted);margin-top:2px;display:flex;gap:8px;align-items:center}
.prog{height:4px;border-radius:2px;background:var(--panel-muted);overflow:hidden;margin:5px 0 3px}
.prog i{display:block;height:100%;width:64%;background:var(--accent);border-radius:2px}
.xfer .ops{display:none;gap:2px}
.xfer:hover .ops{display:flex}
.xfer:hover .when{display:none}

/* 空态/横幅 */
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.empty .ic{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ink-muted);margin-bottom:6px}
.empty .big{font-weight:650;font-size:14px}
.empty .sub{font-size:11.5px;color:var(--ink-muted);margin-bottom:10px}
.banner{display:flex;align-items:center;gap:12px;padding:9px 16px;background:var(--red-soft);border-bottom:1px solid color-mix(in srgb,var(--red) 25%,transparent);font-size:12px;color:var(--red)}
.banner .msg{flex:1;line-height:1.55}
.banner .msg b{font-weight:650}

/* PiP / 桌面 */
.pip{width:440px;border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;background:var(--panel);box-shadow:var(--shadow-pop)}
.pip .ph{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--panel-muted);border-bottom:1px solid var(--line);font-size:11px;font-weight:600}
.menubar{display:flex;align-items:center;gap:10px;height:26px;background:var(--shell);color:#d7dde5;font-size:11px;padding:0 12px;border-radius:6px;width:fit-content}
.traymenu{width:210px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow-pop);padding:5px;font-size:12.5px}
.traymenu .mi{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:5px}
.traymenu .mi:hover{background:var(--panel-muted)}
.traymenu .sep{height:1px;background:var(--line);margin:4px 6px}
.traymenu .live{margin-left:auto;color:var(--accent);font-size:10.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.traymenu .live i{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:pl 1.4s infinite}

.note-pad{padding:8px 0 40px}
</style>
</head>
<body>

<nav id="index">
  <h1>重设计原型 v2</h1>
  <button data-s="s1" class="on"><span class="sid">S1</span>主框架 · ⌘K</button>
  <button data-s="s2"><span class="sid">S2</span>服务器侧栏</button>
  <button data-s="s3"><span class="sid">S3</span>日志检索</button>
  <button data-s="s4"><span class="sid">S4</span>切片 + 实时</button>
  <button data-s="s5"><span class="sid">S5</span>终端工作台</button>
  <button data-s="s6"><span class="sid">S6</span>文件浏览</button>
  <button data-s="s7"><span class="sid">S7</span>文件预览</button>
  <button data-s="s8"><span class="sid">S8</span>传输记录抽屉</button>
  <button data-s="s9"><span class="sid">S9</span>工具抽屉</button>
  <button data-s="s10"><span class="sid">S10</span>设置中心</button>
  <button data-s="s11"><span class="sid">S11</span>桌面能力</button>
  <button data-s="s12"><span class="sid">S12</span>空态与错误</button>
  <button data-s="s13"><span class="sid">S13</span>核心排障动线</button>
  <button data-s="s14"><span class="sid">S14</span>外观 · 主题 · 水印</button>
  <button data-s="s15"><span class="sid">S15</span>窗口与断点</button>
  <div class="foot">
    对标：<b>Linear</b> 抽屉体系 · <b>Raycast</b> ⌘K 面板 · <b>Warp</b> 内联进度 · <b>VS Code</b> 面包屑/页签<br/><br/>
    皮肤延续已确认方向：全白通栏 · 细线分隔 · 紧凑密度。<br/>每屏底部蓝字为决策点。
  </div>
</nav>

<div id="stage">
  <div id="desc"><span class="n" id="d-n"></span><span class="d" id="d-d"></span></div>
  <div id="viewport"></div>
</div>

<script>
/* ============ 图标（lucide 路径） ============ */
const I = {

        `<div style="flex:0 0 150px;border-right:1px solid var(--line);padding:8px"><div style="height:7px;width:70%;background:var(--panel-muted);border-radius:3px;margin-bottom:6px"></div><div style="height:7px;width:50%;background:var(--panel-muted);border-radius:3px"></div></div>
         <div style="flex:1;padding:8px"><div style="height:7px;width:60%;background:var(--accent-soft);border-radius:3px"></div></div>
         <div style="flex:0 0 0px"></div>`,
        "侧栏压到 200；抽屉改为覆盖式（浮在内容上，不挤压表格）；文件树 <1024 自动隐藏（目录改下拉）。")}
      ${mini(250,264,"800×600 最小窗口",
        `${rail}<div style="flex:1;padding:8px"><div style="height:7px;width:66%;background:var(--accent-soft);border-radius:3px;margin-bottom:6px"></div><div style="height:7px;width:80%;background:var(--panel-muted);border-radius:3px"></div></div>`,
        "侧栏折叠为 56px 图标列（服务器头像点竖排，悬浮展开全名）；表格隐藏「类型」列保「大小/时间」。")}
    </div>
    <div style="margin-top:20px;border:1px solid var(--line);border-radius:10px;overflow:hidden;max-width:980px">
      <div style="padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel-muted);font-weight:650;font-size:12px">窗口适配规范（实施必须遵守）</div>
      <table class="tbl">
        <tr><th style="width:170px">断点</th><th>行为</th></tr>
        <tr><td class="mono">≥ 1440</td><td>侧栏 240 · 设置清单 268 · 抽屉 420 推挤式 · 文件树常驻</td></tr>
        <tr><td class="mono">1024 – 1440</td><td>侧栏 200 · 抽屉覆盖式（带遮罩点击关闭）· 文件树常驻</td></tr>
        <tr><td class="mono">800 – 1024</td><td>侧栏折叠 56 图标列（悬浮展开）· 文件树隐藏改下拉 · 抽屉覆盖式</td></tr>
        <tr><td class="mono">&lt; 800 / 最小尺寸</td><td>表格隐藏「类型」列；工具栏搜索框收缩为图标（点开浮层）；终端分屏改上下堆叠</td></tr>
        <tr><td class="mono">PiP</td><td>默认 980×680，最小 720×420；内容随宽度降级（隐藏工具行次要按钮）</td></tr>
        <tr><td class="mono">通用</td><td>所有面板分隔线统一 <b>1px solid var(--line)</b>，禁止相邻面板双边框叠放（左 pane 不设 border-right + 右 pane border-left）</td></tr>
      </table>
    </div>
  </div>` +
  decision(`<span class="w">防止实现走样：窗口真实状态入规范（本轮反馈）</span> — ① 分割线粗细不统一的根因 = <b>相邻面板双边框叠放</b>（左 pane border-right + 抽屉 border-left = 2px），规范已定死：单边框原则；② 应用里排查到 3 处 2px 边框（transfer 弹窗 / 终端分屏 / 设置锚点），实施时统一收敛为 1px；③ 三档窗口 + 最小尺寸 + PiP 的布局行为写死在上表，实施验收按表核对。`);
}


/* ============ 路由 ============ */
const SCREENS = {
  s1:{n:"S1 主框架 · ⌘K 命令面板",d:"工具栏收敛 · 结果工具行 · 命令面板（Raycast/Linear 模式）",f:s1},
  s2:{n:"S2 服务器侧栏",d:"悬浮快捷操作 · 状态摘要 · 与设置清单同构",f:s2},
  s3:{n:"S3 日志检索",d:"条件两段式 · 高级抽屉 · 进度内联",f:s3},
  s4:{n:"S4 切片 + 实时",d:"紧凑切片条 · LIVE 状态带一体化",f:s4},
  s5:{n:"S5 终端工作台",d:"工作区第三 tab · AI 抽屉 · 快捷命令",f:s5},
  s6:{n:"S6 文件浏览",d:"面包屑 · 批量操作条 · 右键菜单分组",f:s6},
  s7:{n:"S7 文件预览",d:"源码/归档/Class 三态 · 文件内搜索",f:s7},
  s8:{n:"S8 传输记录抽屉",d:"文件窗口内传输 · 表内进度 · 右抽屉同源",f:s8},
  s9:{n:"S9 工具抽屉",d:"隧道/批量/状态/对比 四合一",f:s9},
  s10:{n:"S10 设置中心",d:"已确认的 v2（微调：危险区降为页脚）",f:s10},
  s11:{n:"S11 桌面能力",d:"托盘动态项 · PiP 统一入口 · 置顶",f:s11},
  s12:{n:"S12 空态与错误",d:"错误横幅 · 空状态模板",f:s12},
  s13:{n:"S13 核心排障动线",d:"选服务器 → 检索 → 命中阅读 → 切片/实时接力",f:s13},
  s14:{n:"S14 外观 · 主题 · 水印",d:"背景/字体/水印（新增）/动态背景",f:s14},
  s15:{n:"S15 窗口与断点",d:"三档窗口行为 · 最小尺寸 · 分隔线单边框原则",f:s15},
};
const vp = document.getElementById("viewport");
function go(id){
  document.querySelectorAll("#index button").forEach(b=>b.classList.toggle("on",b.dataset.s===id));
  const meta = SCREENS[id];
  document.getElementById("d-n").textContent = meta.n;
  document.getElementById("d-d").textContent = meta.d;
  vp.innerHTML = `<div class="screen on">${meta.f()}</div>`;
  const pal = vp.querySelector("#pal");
  const kb = vp.querySelector("#kbtn");
  if (kb && pal) kb.addEventListener("click", ()=> pal.style.display = pal.style.display==="none"?"flex":"none");
  const advB = vp.querySelector("#advB"), advX = vp.querySelector("#advX");
  if (advB && advX){ advB.addEventListener("click",()=>{}); }
  const apT = vp.querySelector("#apT");
  if (apT) apT.addEventListener("click",()=>{ apT.classList.toggle("on"); apT.textContent = apT.classList.contains("on")?"显示中 · 点击隐藏":"隐藏 · 点击显示"; });
  location.hash = id;
  document.getElementById("viewport").scrollTop = 0;
}
document.querySelectorAll("#index button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.s)));
const h = location.hash.slice(1);
go(SCREENS[h] ? h : "s1");
window.addEventListener("hashchange",()=>{ const id=location.hash.slice(1); if(SCREENS[id]) go(id); });
</script>
