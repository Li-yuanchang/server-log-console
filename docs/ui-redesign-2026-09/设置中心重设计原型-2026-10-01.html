<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Server Log Console — 设置中心重设计 · 主题系统原型</title>
<style>
/* ============ 基础 token（沿用 v2 原型体系） ============ */
:root{
  --panel:#ffffff; --panel-muted:#f5f5f5; --bg:#fafafa;
  --ink:#171717; --ink-soft:#666666; --ink-muted:#8f8f8f;
  --line:#eaeaea; --line-strong:#d4d4d4;
  --accent:#0070f3; --accent-h:#0060df; --accent-soft:rgba(0,112,243,.08);
  --green:#0a7b3e; --green-dot:#22c55e; --red:#d41313; --red-soft:rgba(212,19,19,.07);
  --amber:#b45309; --amber-soft:rgba(180,83,9,.09);
  --shell:#0a0a0a; --shell-ink:#d7dde5;
  --on-accent:#ffffff;
  --r-s:6px; --r-m:8px; --r-l:10px;
  --mono:"Geist Mono","SFMono-Regular","Menlo","Consolas",monospace;
  --font:"Geist","Inter",-apple-system,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --shadow-pop:0 12px 40px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.06);
  /* 终端配色（T2 联动，默认=控制台） */
  --t-bg:#0a0a0a; --t-ink:#d7dde5; --t-mut:#5c6b7a; --t-p:#7ec8e3; --t-ok:#98c379; --t-err:#e06c75; --t-warn:#e5c07b;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);letter-spacing:-.01em;font-size:12.5px;color:var(--ink);background:var(--bg);display:flex;overflow:hidden}
svg{display:block;flex:none}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;letter-spacing:inherit}
input[type=range]{accent-color:var(--accent)}

/* ---------- 屏索引 ---------- */
#index{flex:0 0 190px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;padding:10px 8px;gap:1px;overflow-y:auto}
#index h1{font-size:12px;font-weight:700;padding:6px 8px 10px}
#index button{display:flex;align-items:center;gap:8px;padding:6px 9px;font-size:12px;color:var(--ink-soft);text-align:left;border-radius:var(--r-s)}
#index button:hover{background:var(--panel-muted);color:var(--ink)}
#index button.on{background:var(--ink);color:#fff;font-weight:600}
#index .sid{font-family:var(--mono);font-size:9.5px;opacity:.6;width:18px}
#index .foot{margin-top:auto;padding:10px 8px;font-size:10px;color:var(--ink-muted);line-height:1.7;border-top:1px dashed var(--line)}
#index .foot b{color:var(--ink-soft)}

/* ---------- 舞台 ---------- */
#stage{flex:1;display:flex;flex-direction:column;min-width:0;color:var(--ink)}
#desc{flex:none;display:flex;align-items:baseline;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
#desc .n{font-weight:700;font-size:13.5px}
#desc .d{font-size:11.5px;color:var(--ink-muted)}
#viewport{flex:1;position:relative;overflow:hidden;background:var(--panel-muted)}
.screen{display:none;position:absolute;inset:0}
.screen.on{display:flex}

/* ---------- 组件 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 12px;font-size:12px;font-weight:500;
  border:1px solid var(--line);border-radius:var(--r-m);background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap;
  transition:background .15s ease,border-color .15s ease,color .15s ease,box-shadow .15s ease}
.btn:hover{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 26%,transparent);color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:550}
.btn.pri:hover{background:var(--accent-h);border-color:var(--accent-h);color:var(--on-accent);box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn.danger{color:var(--red)}
.btn.danger:hover{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 30%,transparent)}
.btn.icon{width:28px;padding:0}
.btn.sm{height:24px;padding:0 9px;gap:5px;font-size:11px;border-radius:var(--r-s)}
.btn.sm.icon{width:24px;padding:0}
.btn[disabled]{opacity:.45;cursor:default;pointer-events:none}
.input{height:28px;padding:0 10px;font-size:12.5px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--panel);color:var(--ink);outline:none;transition:border-color .12s,box-shadow .12s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.input::placeholder{color:var(--ink-muted)}
select.input{appearance:none;padding-right:24px;background-image:linear-gradient(45deg,transparent 49%,var(--ink-muted) 50%),linear-gradient(-45deg,transparent 49%,var(--ink-muted) 50%);background-position:calc(100% - 14px) 12px,calc(100% - 9px) 12px;background-size:5px 5px;background-repeat:no-repeat}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;background:var(--panel)}
.seg>button{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:26px;padding:0 11px;font-size:11.5px;color:var(--ink-soft);border-right:1px solid var(--line);white-space:nowrap}
.seg>button:last-child{border-right:none}
.seg>button.on{color:var(--accent);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--ink-muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.chip.grn{color:var(--green);border-color:color-mix(in srgb,var(--green) 32%,transparent);background:color-mix(in srgb,var(--green) 6%,transparent)}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 11px;font-size:11.5px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);white-space:nowrap}
.pill.on{border-color:var(--accent);color:var(--accent);font-weight:550}
.fchip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 11px;font-size:11.5px;border:1px solid var(--line);border-radius:999px;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.fchip:hover{border-color:var(--line-strong);color:var(--ink)}
.fchip.on{border-color:var(--accent);color:var(--accent);font-weight:550}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--green-dot);box-shadow:0 0 0 3px color-mix(in srgb,var(--green-dot) 15%,transparent)}
.kbd{font-family:var(--mono);font-size:9.5px;color:var(--ink-soft);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 4px;line-height:14px}
.mut{color:var(--ink-muted)}.soft{color:var(--ink-soft)}
.mono{font-family:var(--mono)}
.hr{height:1px;background:var(--line)}
@keyframes pl{50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}

/* 决策条 */
.decision{position:absolute;left:0;right:0;bottom:0;z-index:30;border-top:1px dashed var(--line-strong);background:color-mix(in srgb,var(--panel) 97%,transparent);padding:8px 18px;font-size:11px;line-height:1.75;color:var(--ink-soft)}
.decision b{color:var(--accent);font-weight:650}
.decision .w{color:var(--ink);font-weight:600}

/* 日志行（预览用） */
.ll{display:flex;gap:10px;padding:1px 10px;font-family:var(--mono);font-size:11px;line-height:1.7;color:var(--ink-soft);white-space:nowrap}
.ll .t{color:var(--ink-muted);flex:0 0 92px}
.ll .lv{font-weight:650}
.ll.e .lv{color:var(--red)}
.ll.w .lv{color:var(--amber)}
.ll.i .lv{color:var(--ink-muted)}

/* ---------- 设置中心骨架 ---------- */
.app{display:flex;height:100%;width:100%}
.workspace{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel)}
.ws-head{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--line);flex:none}
.ws-head b{font-size:13.5px}
.anchcol{flex:0 0 172px;border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.anch{display:flex;align-items:center;height:30px;padding:0 12px;border-radius:7px;font-size:12px;color:var(--ink-soft);text-align:left}
.anch:hover{background:var(--panel-muted);color:var(--ink)}
.anch.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.anchcol .note{margin-top:auto;font-size:10.5px;color:var(--ink-muted);line-height:1.7;padding:10px 4px;border-top:1px dashed var(--line)}
.set-scroll{flex:1;overflow:auto;min-height:0;background:var(--bg)}
.set-body{padding:16px 18px 20px;display:flex;gap:16px;align-items:flex-start}
.set-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px;padding-bottom:56px}

/* 设置卡片 */
.card{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.chead{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.chead .tt b{font-size:12.5px;display:block}
.chead .tt .sub{font-size:11px;color:var(--ink-muted);margin-top:2px;line-height:1.5}
.chead .act{margin-left:auto;display:inline-flex;align-items:center;gap:8px;flex:none}
.cbody{padding:6px 14px 12px}

/* 设置行 */
.srow2{display:flex;align-items:center;gap:16px;padding:9px 0;border-bottom:1px dashed var(--line)}
.srow2:last-child{border-bottom:none}
.srow2 b{display:block;font-size:12px;font-weight:550}
.srow2 small{font-size:10.5px;color:var(--ink-muted)}
.srow2 .ctl{margin-left:auto;display:inline-flex;align-items:center;gap:8px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.cin{width:30px;height:24px;padding:1px;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
.sw2{position:relative;width:32px;height:18px;border-radius:999px;background:var(--line-strong);border:none;cursor:pointer;flex:none;transition:background .15s}
.sw2::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw2.on{background:var(--accent)}
.sw2.on::after{transform:translateX(14px)}

/* ---------- T1 主题画廊（4 族横向并排，列内浅/深竖排） ---------- */
/* 主题网格：紧凑 3 列（卡 = 缩略 + 名字，选中即描边；描述进 hover title） */
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tcard{border:1px solid var(--line);border-radius:9px;padding:7px;background:var(--panel);cursor:pointer;text-align:left;position:relative;transition:border-color .15s,box-shadow .15s;display:block;width:100%}
.tcard:hover{border-color:var(--line-strong)}
.tcard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tgrid .mwin{height:106px}
.tc-name{display:flex;align-items:center;gap:6px;margin-top:7px}
.tc-name b{font-size:11.5px;flex:none}
.tone{margin-left:auto;font-size:9.5px;padding:0 6px;border-radius:999px;border:1px solid var(--line);color:var(--ink-muted);flex:none}
.tone.dark{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.tc-desc{font-size:10px;color:var(--ink-muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 迷你窗口：真实应用的等比缩略（顶栏 + 侧栏 + 日志内容区 + 主按钮）
   用主题真实 token 上色，让用户一眼看出「这个主题长什么样」；纹理仅作极淡底噪 */
.mwin{height:96px;border-radius:7px;overflow:hidden;position:relative;display:flex;flex-direction:column;background-repeat:repeat;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.05);transition:transform .15s ease}
.tcard:hover .mwin{transform:translateY(-1px)}
.mw-top{height:16px;flex:none;display:flex;align-items:center;gap:3px;padding:0 7px;border-bottom:1px solid}
.mw-top .d{width:3.5px;height:3.5px;border-radius:50%;flex:none}
.mw-top .t{font-size:6px;margin-left:3px;font-weight:600;letter-spacing:0;white-space:nowrap;overflow:hidden}
.mw-top .live{margin-left:auto;font-size:4.5px;font-weight:700;padding:0 3px;border-radius:6px;line-height:9px;flex:none}
.mw-main{flex:1;display:flex;min-height:0}
.mw-nav{width:31%;flex:none;padding:6px 5px;display:flex;flex-direction:column;gap:5px;border-right:1px solid}
.mw-nav .row{display:flex;align-items:center;gap:3px}
.mw-nav .row .sq{width:5px;height:5px;border-radius:1.5px;flex:none}
.mw-nav .row .bar{height:3px;border-radius:2px;flex:none}
.mw-content{flex:1;min-width:0;padding:6px 7px;display:flex;flex-direction:column;gap:3.5px}
.mw-tools{display:flex;align-items:center;gap:4px;flex:none}
.mw-search{flex:1;height:9px;border-radius:3px;border:1px solid}
.mw-pbtn{height:9px;width:30%;border-radius:3px;flex:none}
.mw-log{display:flex;flex-direction:column;gap:4px;margin-top:1px;overflow:hidden}
.mw-line{display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden}
.mw-line .ts{font-size:5px;font-family:var(--mono);flex:none}
.mw-line .lv{font-size:5px;font-weight:700;font-family:var(--mono);flex:none}
.mw-line .msg{font-size:5px;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis}
/* 工作区底衬：极淡 accent 光晕（无装饰图案，保持干净） */
.ws-wash{position:absolute;inset:0;pointer-events:none;background-image:var(--ws-wash);z-index:0}

/* 强调色圆卡（patchmate 描边环式选中） */
.csw{width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:transparent}
.csw i{width:18px;height:18px;border-radius:50%;display:block;transition:transform .12s}
.csw:hover i{transform:scale(1.1)}
.csw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px currentColor}
/* 渐变预设 */
.grad{height:30px;border-radius:6px;border:1px solid var(--line);cursor:pointer;flex:1;min-width:64px}
.grad.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
/* 右侧大预览（主角） */
.pvcol{flex:0 0 420px;min-width:0;position:sticky;top:0;display:flex;flex-direction:column;gap:8px;padding-bottom:56px}
.pv-cap{padding:7px 2px;font-size:10.5px;color:var(--ink-muted);display:flex;align-items:center;gap:6px}
.pv-cap i{width:6px;height:6px;border-radius:50%;background:var(--green-dot);animation:pl 1.4s infinite}
.pv-ctl{display:flex;align-items:center;gap:6px;padding:2px 2px;flex-wrap:wrap}
.pvhint{font-size:10px;line-height:1.7;color:var(--ink-muted);padding:0 2px}
/* 大预览窗体：背景层 + 半透明面板 + backdrop 毛玻璃（与实现侧 ui-surface-custom 同机制） */
.pvframe{position:relative;min-width:0;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;height:378px;display:flex;flex-direction:column;box-shadow:0 10px 30px color-mix(in srgb,var(--ink) 10%,transparent)}
.pvframe .pf-bg{position:absolute;inset:-16px;background-size:cover;background-position:center;z-index:0}
.pvframe .pf-veil{position:absolute;inset:0;z-index:0}
.pvframe>*:not(.pf-bg):not(.pf-veil){position:relative;z-index:1}
.pf-top{height:30px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid}
.pf-top .d{width:8px;height:8px;border-radius:50%;flex:none}
.pf-top b{font-size:12px;font-weight:650}
.pf-top .sp{flex:1}
.pf-tabs{height:27px;flex:none;display:flex;align-items:center;gap:2px;padding:0 12px;border-bottom:1px solid}
.pf-tabs>span{font-size:11.5px;padding:0 10px;height:27px;display:flex;align-items:center;border-bottom:2px solid transparent}
.pf-tabs>span.on{font-weight:600}
.pf-tabs .live{margin-left:auto;font-size:10px;font-weight:700;border:1px solid;border-radius:999px;padding:1px 8px}
.pf-mid{flex:1;display:flex;min-height:0}
.pf-side{width:170px;flex:none;border-right:1px solid;padding:8px 0;display:flex;flex-direction:column;gap:1px}
.pf-side .q{margin:0 9px 7px;height:24px;border:1px solid;border-radius:6px;font-size:11px;display:flex;align-items:center;padding:0 9px}
.pf-side .r{display:flex;align-items:center;gap:8px;padding:5px 12px}
.pf-side .r i{width:7px;height:7px;border-radius:50%;flex:none}
.pf-side .r .c{display:flex;flex-direction:column;min-width:0}
.pf-side .r b{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-side .r small{font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-main{flex:1;display:flex;flex-direction:column;min-width:0}
.pf-tools{flex:none;display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid}
.pf-tools .seg{display:inline-flex;border:1px solid;border-radius:6px;overflow:hidden;flex:none}
.pf-tools .seg i{font-style:normal;font-size:11.5px;padding:3px 10px;display:flex;align-items:center}
.pf-tools .seg i.on{font-weight:600}
.pf-tools .q{height:24px;min-width:0;border:1px solid;border-radius:6px;font-size:11px;display:flex;align-items:center;padding:0 9px;overflow:hidden;white-space:nowrap}
.pf-tools .pbtn{font-size:11.5px;font-weight:600;padding:4px 13px;border-radius:6px;flex:none}
.pf-log{flex:1;padding:8px 0;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.pf-log .ll{display:flex;gap:10px;padding:0 12px;font-family:var(--mono);font-size:11px;line-height:1.85;white-space:nowrap}
.pf-log .lt{flex:0 0 128px}
.pf-log .lv{flex:none;font-weight:700}
.pf-log .lm{overflow:hidden;text-overflow:ellipsis}
.pf-foot{flex:none;padding:6px 12px;font-size:10.5px;border-top:1px solid}

/* ---------- T2 终端 ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pcard{border:1px solid var(--line);border-radius:9px;padding:8px;cursor:pointer;background:var(--panel);text-align:left;transition:border-color .15s,box-shadow .15s;width:100%;position:relative}
.pcard:hover{border-color:var(--line-strong)}
.pcard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pcard .ptick{position:absolute;top:8px;right:8px;width:16px;height:16px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:none;align-items:center;justify-content:center;z-index:2}
.pcard.on .ptick{display:inline-flex}
.pcard .bar{display:block;height:22px;border-radius:5px;margin-bottom:6px}
.pcard b{font-size:11.5px}
.pcard .d{font-size:10px;color:var(--ink-muted);margin-top:1px}
.termview{background:var(--t-bg);color:var(--t-ink);font-family:var(--mono);border-radius:8px;padding:12px 14px;font-size:11.5px;line-height:1.8;overflow:hidden}
.termview .tm{color:var(--t-mut)}
.termview .tp{color:var(--t-p)}
.termview .tok{color:var(--t-ok)}
.termview .te{color:var(--t-err)}
.termview .tw{color:var(--t-warn)}
.tcur{display:inline-block;width:7px;height:13px;background:var(--t-ink);vertical-align:-2px;animation:pl 1s steps(1) infinite}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.stepper button{width:24px;height:24px;color:var(--ink-soft)}
.stepper button:hover{background:var(--panel-muted);color:var(--ink)}
.stepper output{min-width:34px;text-align:center;font-family:var(--mono);font-size:11px;border-left:1px solid var(--line);border-right:1px solid var(--line);line-height:24px}

/* ---------- T3/T4 ---------- */
.wmbox{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:8px;min-height:118px;background:var(--panel)}
.wm-ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden}
.wm-ov>div{transform:rotate(-22deg);font-size:12px;color:var(--ink);font-weight:700;white-space:nowrap;line-height:3;text-align:center;opacity:.07}
.code{font-family:var(--mono);font-size:10.5px;line-height:1.8;background:var(--panel-muted);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto;white-space:pre;color:var(--ink-soft)}
.code .k{color:var(--accent)}
.code .c{color:var(--ink-muted)}

.pan{display:grid;grid-template-columns:repeat(auto-fill,minmax(264px,1fr));gap:16px}
.pancard{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--panel);transition:border-color .15s,box-shadow .15s;text-align:left;width:100%}
.pancard:hover{border-color:var(--line-strong)}
.pancard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.bigwin{height:158px;border-radius:7px;overflow:hidden;border:1px solid rgba(0,0,0,.1);position:relative;display:flex;flex-direction:column}
.bw-bar{height:14px;display:flex;align-items:center;gap:3px;padding:0 6px;border-bottom:1px solid}
.bw-bar i{width:4px;height:4px;border-radius:50%}
.bw-bar b{font-size:8px;margin-left:3px;font-weight:600}
.bw-main{flex:1;display:flex;min-height:0}
.bw-side{width:30%;padding:6px 5px;display:flex;flex-direction:column;gap:3px;border-right:1px solid}

.bw-body{flex:1;padding:6px 8px;display:flex;flex-direction:column;gap:3px;font-size:6.5px;line-height:1.9;font-family:var(--mono);white-space:nowrap;overflow:hidden}
.bw-btn{margin-top:auto;height:10px;width:36%;border-radius:3px}

/* ============ 当前状态（原型内存态） ============ */

const stage = document.getElementById("stage");

/* ============ 应用逻辑 ============ */
/* 相对亮度（WCAG 2.x） */
const relLum = hex => {
  const c = parseInt(hex.slice(1), 16);
  const ch = [(c>>16)&255, (c>>8)&255, c&255].map(v=>{ v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); });
  return 0.2126*ch[0] + 0.7152*ch[1] + 0.0722*ch[2];
};
const contrast = (a,b) => { const x=relLum(a), y=relLum(b); return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05); };
/* on-accent 正确规则：在黑字/白字中取对比度更高者。
   ⚠ 修复：原实现用「亮度 > 0.55 取黑」的固定阈值，导致天蓝/琥珀/薄荷等中亮强调色
   误取白字，主按钮文字对比度低至 2.27:1（不可读）。改为直接比对比度。 */
const onAccent = accent => contrast("#ffffff", accent) >= contrast("#171717", accent) ? "#ffffff" : "#171717";
const accentHover = (hex,dark) => dark
  ? `color-mix(in srgb, ${hex} 82%, #ffffff)`
  : `color-mix(in srgb, ${hex} 86%, #000000)`;

function applyTheme(t, silent){

    "--green":t.sem.green,"--red":t.sem.red,"--amber":t.sem.amber,
    "--red-soft":`color-mix(in srgb, ${t.sem.red} 12%, transparent)`,
    "--amber-soft":`color-mix(in srgb, ${t.sem.amber} 12%, transparent)`,
    "--green-dot":t.sem.green};
  for(const k in map) stage.style.setProperty(k, map[k]);
  /* 工作区底衬：极淡 accent 光晕（无装饰图案） */
  stage.style.setProperty("--ws-wash", surfaceWash(t));
  applyAccent(curAccent);
  renderThemeStates();
  renderPv();
}
function applyAccent(hex){
  curAccent = hex;
  const eff = hex || curTheme.v.accent;
  stage.style.setProperty("--accent", eff);
  stage.style.setProperty("--accent-h", accentHover(eff, curTheme.tone==="dark"));
  stage.style.setProperty("--accent-soft", `color-mix(in srgb, ${eff} 8%, transparent)`);
  stage.style.setProperty("--on-accent", onAccent(eff));
  renderAccentStates();
}
function applyTerm(t){
  curTerm = t;
  for(const k in t.v) stage.style.setProperty("--t-"+({bg:"bg",ink:"ink",mut:"mut",p:"p",ok:"ok",err:"err",warn:"warn"}[k]), t.v[k]);
  document.querySelectorAll(".pcard").forEach(c=>c.classList.toggle("on", c.dataset.term === t.id));
}

/* ---- 渲染：主题卡 / 强调色行 / 摘要（按当前状态刷新选中态） ---- */
/* 主题的工作区底衬：不用装饰图案（那是"廉价壁纸"感的来源），
   改用极淡的 accent 光晕（ambient glow）——shadcn / Linear / Vercel 等做法：
   背景保持干净，仅在角落用一点主题色晕染，让整屏有"色温"而没有噪点。
   返回 CSS gradient（非 url()，无编码问题）。 */
function surfaceWash(t){
  const a = t.v.accent;
  const o1 = t.tone==="light" ? 7 : 11, o2 = t.tone==="light" ? 5 : 8;
  return `radial-gradient(120% 105% at 12% 0%, color-mix(in srgb, ${a} ${o1}%, transparent), transparent 58%),`
       + `radial-gradient(100% 100% at 100% 100%, color-mix(in srgb, ${a} ${o2}%, transparent), transparent 60%)`;
}

      <span class="bar" style="width:${x.w};background:${x.c};opacity:${x.on?.8:.3}"></span>
    </span>`).join("");
  const lines = [
    {ts:"09:02", lv:"ERROR", lc:r,  m:"sync failed: connection reset"},
    {ts:"09:02", lv:"INFO",  lc:v.soft, m:"retry 1/3 scheduled in 5s"},
    {ts:"09:03", lv:"ERROR", lc:r,  m:"sync failed again, giving up"},
    {ts:"09:03", lv:"WARN",  lc:am, m:"mark job #4821 as FAILED"},
  ].map(l=>`<span class="mw-line">
      <span class="ts" style="color:${v.mut}">${l.ts}</span>
      <span class="lv" style="color:${l.lc}">${l.lv}</span>
      <span class="msg" style="color:${v.soft}">${l.m}</span>
    </span>`).join("");
  return `<span class="mwin" style="background-image:${surfaceWash(t)};background-color:${v.bg}">
    <span class="mw-top" style="background:${v.panel};border-color:${v.line}">
      <span class="d" style="background:${v.lineS}"></span><span class="d" style="background:${v.lineS}"></span><span class="d" style="background:${v.lineS}"></span>
      <span class="t" style="color:${v.soft}">127.38 · 日志预览</span>
      <span class="live" style="background:${r};color:#fff">LIVE</span>
    </span>
    <span class="mw-main">
      <span class="mw-nav" style="background:${v.muted};border-color:${v.line}">${nav}</span>
      <span class="mw-content">

const encSvg = s => encodeURIComponent(s).replace(/'/g,"%27").replace(/\(/g,"%28").replace(/\)/g,"%29");
function noiseTile(tone){

}
function wallpaperTile(accent,tone){
  const base = tone==='light' ? '#c9d6ea' : '#0a0f1a';
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300' preserveAspectRatio='xMidYMid slice'><defs><filter id='b' x='-30%' y='-30%' width='160%' height='160%'><feGaussianBlur stdDeviation='60'/></filter></defs><rect width='400' height='300' fill='${base}'/><g filter='url(#b)'><circle cx='60' cy='70' r='120' fill='${accent}' opacity='${tone==='light'?0.9:0.72}'/><circle cx='345' cy='70' r='105' fill='#7c3aed' opacity='${tone==='light'?0.72:0.6}'/><circle cx='325' cy='255' r='130' fill='#0891b2' opacity='${tone==='light'?0.68:0.55}'/><circle cx='100' cy='275' r='95' fill='#ea580c' opacity='${tone==='light'?0.6:0.46}'/><circle cx='200' cy='150' r='70' fill='#e11d48' opacity='${tone==='light'?0.4:0.34}'/></g></svg>`;
  return `url('data:image/svg+xml,${encSvg(svg)}')`;
}

    stage.style.setProperty(inp.dataset.sem, inp.value);
  }));
  /* 背景层 chips 与滑杆由 renderBg() 自行接线 */
  /* T5 全景卡点击套用 */
  document.querySelectorAll(".pancard[data-th]").forEach(b=>b.addEventListener("click",()=>{
    applyTheme(THEMES.find(t=>t.id===b.dataset.th));
    document.querySelectorAll(".pancard").forEach(x=>x.classList.toggle("on",x===b));
  }));
}
/* toneMode 兼作画廊过滤：浅色/深色时隐藏不匹配的卡片 */
function setToneFilter(mode){
  document.querySelectorAll("#themeGrid [data-th]").forEach(card=>{
    const t = THEMES.find(x=>x.id===card.dataset.th);
    card.style.display = (mode==="system" || t.tone===mode) ? "" : "none";
  });
}

/* ============ 路由 ============ */
const SCREENS = {
  t1:{n:"T1 外观 · 主题画廊",d:"紧凑主题网格 · 大预览主角 · 背景 8 种即时叠加",f:t1},
  t2:{n:"T2 终端配色与光标",d:"8 款 xterm 配色 · 仿真预览 · 字号/行高/光标",f:t2},
  t3:{n:"T3 字体 · 水印 · 动效",d:"字体三处独立 · 水印模板 · 动效与恢复默认",f:t3},
  t4:{n:"T4 自定义主题 · 导入导出",d:"基底 + 覆盖层（含强调色覆盖）· slc-theme.json v1",f:t4},
  t5:{n:"T5 主题全景对照",d:"8 套主题 × 真实 token 窗口 · 验收清单",f:t5},
};
const vp = document.getElementById("viewport");
function go(id){
  /* 支持 #t1:carbon 深链：打开指定屏并直接套用某主题 */
  const [sid, thid] = id.split(":");
  if(thid){ const t = THEMES.find(x=>x.id===thid); if(t) applyTheme(t); }
  document.querySelectorAll("#index button").forEach(b=>b.classList.toggle("on",b.dataset.s===sid));
  const meta = SCREENS[sid];
  document.getElementById("d-n").textContent = meta.n;
  document.getElementById("d-d").textContent = meta.d;
  vp.innerHTML = `<div class="screen on">${meta.f()}</div>`;
  renderThemeGrid();
  renderBg();
  renderPv();
  renderAccentStates();
  renderTermGrid();
  wire();
  location.hash = id;
  vp.scrollTop = 0;
}
document.querySelectorAll("#index button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.s)));
applyTheme(THEMES[0], true);
applyTerm(TERMS[0]);
const h = location.hash.slice(1);
go(SCREENS[h.split(":")[0]] ? h : "t1");
window.addEventListener("hashchange",()=>{ const id=location.hash.slice(1); if(SCREENS[id.split(":")[0]]) go(id); });
</script>
