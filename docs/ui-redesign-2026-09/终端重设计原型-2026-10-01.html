<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Server Log Console — 终端重设计原型 · 常规 / 好用 / 方便</title>
<style>
:root {
  --panel:#ffffff; --panel-muted:#f5f5f5; --bg:#fafafa;
  --ink:#171717; --ink-soft:#666666; --ink-muted:#8f8f8f;
  --line:#eaeaea; --line-strong:#d4d4d4;
  --accent:#0070f3; --accent-h:#0060df; --accent-soft:rgba(0,112,243,.08);
  --green:#0a7b3e; --green-dot:#22c55e; --red:#d41313; --red-soft:rgba(212,19,19,.07);
  --amber:#b45309; --amber-soft:rgba(180,83,9,.09);
  --shell:#0a0a0a; --shell-ink:#d7dde5; --shell-mut:#5c6b7a;
  --on-accent:#ffffff;
  --r-s:6px; --r-m:8px; --r-l:10px;
  --mono:"Geist Mono","SFMono-Regular","Menlo","Consolas",monospace;
  --font:"Geist","Inter",-apple-system,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --shadow-pop:0 12px 40px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);letter-spacing:-.01em;font-size:12.5px;color:var(--ink);background:var(--bg);display:flex;overflow:hidden}
svg{display:block;flex:none}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;letter-spacing:inherit}

/* ---------- 屏索引 ---------- */
#index{flex:0 0 178px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;padding:10px 8px;gap:1px;overflow-y:auto}
#index h1{font-size:12px;font-weight:700;padding:6px 8px 10px}
#index h1 small{display:block;font-weight:500;font-size:10px;color:var(--ink-muted);margin-top:3px}
#index button{display:flex;align-items:center;gap:8px;padding:6px 9px;font-size:12px;color:var(--ink-soft);text-align:left;border-radius:var(--r-s)}
#index button:hover{background:var(--panel-muted);color:var(--ink)}
#index button.on{background:var(--ink);color:#fff;font-weight:600}
#index .sid{font-family:var(--mono);font-size:9.5px;opacity:.6;width:18px}
#index .foot{margin-top:auto;padding:10px 8px;font-size:10px;color:var(--ink-muted);line-height:1.7;border-top:1px dashed var(--line)}
#index .foot b{color:var(--ink-soft)}

/* ---------- 舞台 ---------- */
#stage{flex:1;display:flex;flex-direction:column;min-width:0}
#desc{flex:none;display:flex;align-items:baseline;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
#desc .n{font-weight:700;font-size:13.5px}
#desc .d{font-size:11.5px;color:var(--ink-muted)}
#viewport{flex:1;position:relative;overflow:hidden;background:var(--panel)}
.screen{display:none;position:absolute;inset:0;flex-direction:column}
.screen.on{display:flex}
body.shot #index,body.shot #desc{display:none}

/* ---------- 设计系统（与 prototype.html 同源 token） ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 12px;font-size:12px;font-weight:500;
  border:1px solid var(--line);border-radius:var(--r-m);background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap;
  transition:background .15s ease,border-color .15s ease,color .15s ease,box-shadow .15s ease}
.btn:hover{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 26%,transparent);color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:550}
.btn.pri:hover{background:var(--accent-h);border-color:var(--accent-h);color:var(--on-accent);box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn.danger{color:var(--red)}
.btn.danger:hover{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 30%,transparent);color:var(--red)}
.btn.icon{width:28px;padding:0}
.btn.sm{height:24px;padding:0 9px;gap:5px;font-size:11px;border-radius:var(--r-s)}
.btn.sm.icon{width:24px;padding:0}
.btn.ton{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--accent);font-weight:550}
.btn[disabled]{opacity:.45;cursor:default;pointer-events:none}
.input{height:28px;padding:0 10px;font-size:12.5px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--panel);color:var(--ink);outline:none;transition:border-color .12s,box-shadow .12s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.input::placeholder{color:var(--ink-muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;background:var(--panel)}
.seg>button{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:28px;padding:0 11px;font-size:12px;color:var(--ink-soft);border-right:1px solid var(--line);white-space:nowrap}
.seg>button:last-child{border-right:none}
.seg>button.on{background:transparent;color:var(--accent);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--ink-muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.chip.grn{color:var(--green);border-color:color-mix(in srgb,var(--green) 32%,transparent);background:color-mix(in srgb,var(--green) 6%,transparent)}
.chip.red{color:var(--red);border-color:color-mix(in srgb,var(--red) 30%,transparent)}
.chip.amb{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 30%,transparent)}
.fchip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 11px;font-size:11.5px;border:1px solid var(--line);border-radius:999px;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.fchip:hover{border-color:var(--line-strong);color:var(--ink)}
.kbd{font-family:var(--mono);font-size:9.5px;color:var(--ink-soft);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 4px;line-height:14px}
.mut{color:var(--ink-muted)}.soft{color:var(--ink-soft)}
.mono{font-family:var(--mono)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.on{background:var(--green-dot);box-shadow:0 0 0 3px rgba(34,197,94,.15)}
.dot.off{background:#c8ccd2;box-shadow:0 0 0 3px rgba(0,0,0,.05)}
.dot.err{background:var(--red);box-shadow:0 0 0 3px rgba(212,19,19,.14)}
.dot.wait{background:var(--amber)}

/* ---------- 应用框架 ---------- */
.app{display:flex;height:auto;flex:1;min-height:0;width:100%}
.sidebar{flex:0 0 240px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel);min-height:0}
.workspace{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.wtabs{display:flex;align-items:center;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);flex:none}
.wtab{display:flex;align-items:center;gap:6px;height:34px;padding:0 13px;font-size:12px;color:var(--ink-soft);border-bottom:2px solid transparent}
.wtab.on{color:var(--accent);font-weight:600;border-bottom-color:var(--accent)}
.tbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex:none}
.content{flex:1;min-height:0;position:relative;overflow:auto}

/* 侧栏行（与主原型一致） */
.srow{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px 0 14px;cursor:pointer}
.srow:hover{background:color-mix(in srgb,var(--ink) 3.5%,transparent)}
.srow.cur{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.srow .meta{flex:1;min-width:0}
.srow .nm{display:flex;align-items:center;gap:6px;font-weight:550;font-size:12.5px;white-space:nowrap;overflow:hidden}
.srow .nm .x{color:var(--ink-muted);font-weight:500}
.srow .host{font-family:var(--mono);font-size:10px;color:var(--ink-muted)}
.srow .port{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.srow .qa{display:none;gap:2px}
.srow.hov .qa{display:flex}
.srow.hov .port{display:none}
.grp{display:flex;align-items:center;gap:6px;padding:12px 14px 4px;font-size:10.5px;font-weight:600;color:var(--ink-muted)}
.grp .c{color:var(--line-strong);font-weight:500}
.qa .btn{border-color:transparent;background:transparent;color:var(--ink-muted)}
.qa .btn:hover{border-color:var(--line);background:var(--panel);color:var(--ink)}
.side-foot{border-top:1px solid var(--line);padding:7px 14px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-soft);cursor:pointer}

/* ---------- 终端 ---------- */
.term{flex:1;background:var(--shell);color:var(--shell-ink);font-family:var(--mono);font-size:11px;line-height:1.8;padding:12px 16px;overflow:hidden;min-width:0;min-height:0}
.term .tl{white-space:nowrap}
.term .u{color:#98c379;font-weight:600}
.term .pth{color:#7ec8e3}
.term .dim{color:var(--shell-mut)}
.term .err{color:#e06c75}
.term .wrn{color:#e5c07b}
.term .cya{color:#61afef}
.term .ok{color:#98c379}
.term .hl{background:rgba(0,112,243,.38);border-radius:2px}
.term .sel{background:rgba(0,112,243,.30)}
.term .cursor{display:inline-block;width:7px;height:13px;background:#ededed;vertical-align:-2px;animation:pl 1s steps(1) infinite}
@keyframes pl{50%{opacity:.25}}

/* 终端标签条 */
.ttabs{display:flex;align-items:center;gap:2px;padding:0 8px;border-bottom:1px solid var(--line);height:31px;flex:none;background:var(--panel);overflow-x:auto}
.ttab{display:flex;align-items:center;gap:6px;height:24px;padding:0 7px 0 10px;font-size:11.5px;color:var(--ink-soft);border-radius:6px;cursor:pointer;white-space:nowrap;max-width:230px;flex:none}
.ttab:hover{background:var(--panel-muted);color:var(--ink)}
.ttab.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.ttab .dot{width:6px;height:6px}
.ttab .dot.on{box-shadow:0 0 0 2px rgba(34,197,94,.14)}
.ttab .nm{overflow:hidden;text-overflow:ellipsis}
.ttab .cl{display:none;width:15px;height:15px;border-radius:4px;align-items:center;justify-content:center;color:var(--ink-muted);flex:none}
.ttab:hover .cl{display:flex}
.ttab .cl:hover{background:var(--line);color:var(--red)}
.tnew{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--ink-muted);flex:none}
.tnew:hover{background:var(--panel-muted);color:var(--ink)}
.ttabs .hint{margin-left:auto;display:flex;align-items:center;gap:6px;padding-right:4px;flex:none}

/* 快捷命令行 */
.qbar{flex:none;display:flex;align-items:center;gap:6px;padding:0 12px;height:33px;border-top:1px solid var(--line);background:var(--panel);overflow:hidden}
.qbar .lbl{font-size:10.5px;font-weight:600;color:var(--ink-muted);flex:none;margin-right:2px}
.qbar .fchip{height:22px;font-size:11px;font-family:var(--mono);flex:none}
.qbar .fchip .k{font-family:var(--font)}

/* 状态栏 */
.statusbar{flex:none;height:30px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 12px;font-size:11px;line-height:1;color:var(--ink-soft);background:var(--panel);min-width:0;white-space:nowrap;overflow:hidden}
.statusbar svg{display:inline-block;vertical-align:-2px}
.statusbar .sep{width:1px;height:12px;background:var(--line);flex:none}
.statusbar .mono{font-size:10.5px}
.statusbar .grow{flex:1;min-width:0}
.rbar{display:inline-flex;align-items:center;gap:5px;flex:none;cursor:default}
.rbar .tk{width:42px;height:4px;border-radius:2px;background:var(--panel-muted);overflow:hidden;flex:none}
.rbar .tk i{display:block;height:100%;border-radius:2px}
.rbar b{font-weight:600;color:var(--ink);font-family:var(--mono);font-size:10.5px;min-width:30px}
.rbar.warn b{color:var(--amber)}
.rbar.bad b{color:var(--red)}
.rbar .tk i.ok{background:var(--green-dot)}
.rbar .tk i.warn{background:var(--amber)}
.rbar .tk i.bad{background:var(--red)}

/* 查找条（悬浮终端右上） */
.findbar{position:absolute;top:10px;right:14px;z-index:6;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow-pop);padding:5px 8px}
.findbar input{height:24px;width:190px;font-size:11.5px;padding:0 8px}
.findbar .cnt{font-family:var(--mono);font-size:10.5px;color:var(--ink-muted);min-width:36px;text-align:center}
.tgl{width:22px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-family:var(--mono);color:var(--ink-muted);border:1px solid transparent;flex:none}
.tgl:hover{background:var(--panel-muted);color:var(--ink)}
.tgl.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* 分屏 */
.panes{flex:1;display:flex;min-height:0;min-width:0}
.pane{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.pane.act::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1.5px var(--accent);pointer-events:none;z-index:3}
.pdiv{flex:0 0 5px;background:var(--line);cursor:col-resize;position:relative;transition:background .12s}
.pdiv:hover,.pdiv.on{background:var(--accent)}
.pdiv.vrow{cursor:row-resize}

/* 拖拽上传遮罩 */
.dropmask{position:absolute;inset:10px;z-index:7;border:2px dashed var(--accent);border-radius:var(--r-l);
  background:linear-gradient(rgba(10,10,10,.62),rgba(10,10,10,.62)),radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--accent) 30%,transparent),transparent 62%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;color:#fff;pointer-events:none}
.dropmask .big{font-size:13.5px;font-weight:650}
.dropmask .sub{font-size:11px;color:rgba(255,255,255,.72);font-family:var(--mono)}
.dropmask .ic{width:46px;height:46px;border-radius:12px;background:color-mix(in srgb,var(--accent) 34%,transparent);display:flex;align-items:center;justify-content:center;color:#fff}

/* 断线横幅 / toast */
.tbanner{flex:none;display:flex;align-items:center;gap:10px;padding:7px 14px;background:var(--red-soft);border-bottom:1px solid color-mix(in srgb,var(--red) 22%,transparent);font-size:11.5px;color:var(--red)}
.tbanner .msg{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbanner .msg b{font-weight:650}
.toast{position:absolute;right:16px;bottom:16px;z-index:9;display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow-pop);padding:9px 13px;font-size:11.5px;max-width:360px}
.toast .tic{width:24px;height:24px;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.toast .meta{min-width:0}
.toast .fn{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast .sub{font-family:var(--mono);font-size:10px;color:var(--ink-muted);margin-top:1px}

/* 菜单 */
.menu{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow-pop);padding:5px;min-width:190px;font-size:12.5px;z-index:8}
.menu .mi{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:5px;white-space:nowrap}
.menu .mi:hover{background:var(--panel-muted)}
.menu .mi .k{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-muted);padding-left:18px}
.menu .sep{height:1px;background:var(--line);margin:4px 6px}
.menu .danger{color:var(--red)}
.menu .mi.dis{opacity:.4;pointer-events:none}

/* 抽屉（AI） */
.drawer{position:absolute;top:0;right:0;bottom:0;width:320px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:20;animation:din .18s ease}
@keyframes din{from{transform:translateX(24px);opacity:0}}
.dhead{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);flex:none;min-width:0}
.dhead .t{font-weight:700;font-size:13px;flex:1}
.dbody{flex:1;overflow-y:auto;min-height:0}

/* 空态 */
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.empty .ic{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ink-muted);margin-bottom:6px}
.empty .big{font-weight:650;font-size:14px}
.empty .sub{font-size:11.5px;color:var(--ink-muted);margin-bottom:10px}

/* 桌面窗口 mock（T7） */
.desk{flex:1;min-height:0;position:relative;background:#e4e4e4;display:flex;align-items:center;justify-content:center;padding:26px}
.win{background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow-pop);overflow:hidden;display:flex;flex-direction:column}
.win .wh{display:flex;align-items:center;gap:7px;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--panel-muted);font-size:11px;font-weight:600;flex:none}
.wlight{width:9px;height:9px;border-radius:50%;flex:none}

/* 决策条 */
.decision{position:relative;z-index:30;flex:none;border-top:1px dashed var(--line-strong);background:rgba(255,255,255,.97);padding:8px 18px;font-size:11px;line-height:1.75;color:var(--ink-soft)}
.decision b{color:var(--accent);font-weight:650}
.decision .w{color:var(--ink);font-weight:600}

/* T10 规格行 */
.spec{flex:1;min-height:0;overflow:auto;padding:14px 20px 20px;background:var(--panel)}
.spec-row{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.spec-row:last-child{border-bottom:none}
.spec-btn{flex:0 0 148px;display:flex;align-items:flex-start;gap:6px;font-weight:600;font-size:12px;color:var(--ink);padding-top:1px}
.spec-btn svg{color:var(--ink-soft)}
.spec-body{flex:1;min-width:0;font-size:11.5px;line-height:1.85;color:var(--ink-soft)}
.spec-body b{color:var(--ink);font-weight:600}
.spec-body .kbd{margin:0 1px}
.spec-menu-cap{font-size:10.5px;font-weight:650;color:var(--ink-muted);letter-spacing:.05em;margin:14px 0 6px}
.spec-menu-cap:first-child{margin-top:0}

/* 管理对话框 */
.dlg-mask{position:absolute;inset:0;z-index:25;background:rgba(23,23,23,.28);display:flex;align-items:center;justify-content:center}
.dlg{width:520px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.22);overflow:hidden;display:flex;flex-direction:column}
.dlg .dh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px}
.dlg .db{padding:6px 10px;max-height:330px;overflow:auto}
.dlg .df{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}
.qrow{display:flex;align-items:center;gap:8px;padding:7px 6px;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:none}
.qrow .grip{color:var(--ink-muted);cursor:grab}
.qrow .qn{font-weight:550;width:150px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .qc{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>

<nav id="index">
  <h1>终端重设计<small>常规 · 好用 · 方便 · 2026-10-01</small></h1>
  <button data-s="t1" class="on"><span class="sid">T1</span>常规布局总览</button>
  <button data-s="t2"><span class="sid">T2</span>多标签 · 分屏</button>
  <button data-s="t3"><span class="sid">T3</span>查找 · 右键菜单</button>
  <button data-s="t4"><span class="sid">T4</span>断线与重连</button>
  <button data-s="t5"><span class="sid">T5</span>拖拽上传</button>
  <button data-s="t6"><span class="sid">T6</span>AI 助手（抽屉）</button>
  <button data-s="t7"><span class="sid">T7</span>弹出独立窗口</button>
  <button data-s="t8"><span class="sid">T8</span>未连接空态</button>
  <button data-s="t9"><span class="sid">T9</span>快捷命令管理</button>
  <button data-s="t10"><span class="sid">T10</span>工具行动作明细</button>
  <div class="foot">

            单击 = 切换焦点标签（整个终端区与状态栏随之切换）。<b>⌘T</b> 新建一条到<b>当前服务器</b>的会话；<b>⌘W</b> 关闭当前标签（会话先 detach，网关保留 90 秒，期内可重连恢复）。悬浮显示 <b>×</b>；桌面端支持中键关闭。标签右键菜单：<b>关闭 / 关闭其他 / 全部关闭</b>。状态点：绿=已连接 · 橙=连接中 · 红=断开 · 灰=手动断开。同一工作区内标签互不影响，切换上层工作区 tab 时整套替换。`)}
          ${row(`${ic("search",14)} 查找`, `
            点击 ⇄ 在终端右上呼出/关闭<b>悬浮查找条</b>（见 T3），<b>⌘F</b> 同效，<span class="kbd">Esc</span> 关闭。条内：命中计数 n/N · 上/下一个（<span class="kbd">⏎</span>/<span class="kbd">⇧⏎</span>）· <span class="kbd">Aa</span> 区分大小写 · <span class="kbd">.*</span> 正则；命中项高亮并随导航滚动。作用于<b>焦点窗格</b>。实现：xterm-addon-search。<b>禁用</b>：无任何会话。`)}
          ${row(`${ic("splitv",14)} 分屏 ▾`, `
            <b>单窗格时</b>主点击 = 直接左右分屏；<b>已分屏时</b>主点击 = 展开菜单：<b>左右分屏</b>（桌面端 <span class="kbd">⌘D</span>）/ <b>上下分屏</b> / <b>三分格</b> / <b>关闭当前窗格</b>（仅剩一个窗格时置灰）。新窗格 = 自动新建一条到当前服务器的会话（等价 ⌘T），焦点移到新窗格；布局收进菜单后工具行不再平铺三个分屏按钮。分隔条 5px 拖拽把手。<b>禁用</b>：无任何会话。`)}
          ${row(`${ic("upload",14)} 上传`, `
            点击 = 系统文件选择器（<b>可多选</b>），上传到<b>焦点窗格会话的当前目录</b>；与<b>拖拽上传同一条通道</b>（遮罩见 T5）：统一传输体系、进度进传输记录抽屉、toast 摘要、同名询问（覆盖/重命名/跳过）。<b>禁用</b>：无任何会话。`)}
          ${row(`${ic("cmdk",14)} 快捷命令`, `
            <b>开关</b>底部快捷命令行（默认开，开态按钮高亮，选择持久化）。行内 chip：<b>单击 = 发送到焦点窗格并执行</b>；<b>⌘点 = 仅填入不执行</b>（补参数再回车）；<b>右键 chip</b> = 发送 / 仅填入 / 编辑 / 删除；行尾<b>「管理」</b>= 管理对话框（T9：拖拽排序、预设保护、<span class="mono">{CWD}</span> 按焦点窗格当前目录展开）。<b>禁用</b>：无任何会话（管理入口保留在 T9 对话框，可从命令面板进）。`)}
          ${row(`${ic("zap",14)} AI`, `
            开关右侧 <b>AI 抽屉</b>（非模态侧挂，见 T6），<b>⌘J</b> 同效。自动引用<b>焦点窗格选中内容</b>（无选中可直接提问）；建议命令 <b>↵ 直发焦点窗格</b>；危险命令沿用既有拦截/备份门控（ai-service 不动）；API 配置只在设置中心-偏好。<b>禁用</b>：无任何会话。`)}
          ${row(`${ic("expand",14)} 弹出`, `
            把<b>当前工作区的整个终端组</b>（全部标签 + 分屏布局）弹为独立窗口：桌面端 = Electron 窗口 / 浏览器 = Document PiP。弹出后主窗留<b>占位卡</b>可收回（T7）；独立窗内「收回」回嵌；<b>全局仅一个弹出实例</b>（复用既有 reconcile 所有权机制）。<b>禁用</b>：无任何会话。`)}
          ${row(`${ic("more",14)} ⋯ 更多`, `
            菜单明细见右侧 mock。要点：<b>清屏</b>只清本地回滚缓冲，<b>不向远端发送任何不可见字符</b>（JumpServer 菜单 shell 兼容，网关既有红线）；<b>重连</b>仅对断开会话可用；<b>断开</b>= detach（90 秒保留）；<b>在文件目录中打开</b>= 切到文件视图并定位终端 cwd（双向联动）；<b>导出会话记录</b>= 下载当前标签回滚缓冲为 <span class="mono">terminal-&lt;主机&gt;-&lt;时间&gt;.log</span>；<b>终端设置</b>= 跳设置中心-外观（终端字体族/字号/回滚行数），不另设第二设置面。`)}
        </div>
        <div style="flex:0 0 330px;overflow:auto;padding:14px 18px;background:var(--bg)">
          <div class="spec-menu-cap">⋯ 菜单（展开态）</div>
          <div class="menu" style="position:static;box-shadow:none;border-color:var(--line)">
            ${mi("x","清屏","清回滚缓冲")}
            ${mi("refresh","重连","无断开时置灰")}
            ${mi("plug","断开连接","","")}
            <div class="sep"></div>
            ${mi("folder","在文件目录中打开")}
            ${mi("download","导出会话记录")}
            <div class="sep"></div>
            ${mi("gear","终端设置","→ 设置中心")}
          </div>
          <div class="spec-menu-cap">快捷命令 chip · 右键</div>
          <div class="menu" style="position:static;box-shadow:none;border-color:var(--line)">
            ${mi("play","发送并执行")}
            ${mi("pencil","仅填入不执行","= ⌘点")}
            <div class="sep"></div>
            ${mi("pencil","编辑…")}
            ${mi("trash","删除","")}
          </div>
          <div class="spec-menu-cap">终端标签 · 右键</div>
          <div class="menu" style="position:static;box-shadow:none;border-color:var(--line)">
            ${mi("x","关闭","⌘W")}
            ${mi("x","关闭其他")}
            ${mi("trash","全部关闭")}
          </div>
          <div class="spec-menu-cap">快捷键总表（桌面端）</div>
          <div style="font-size:11px;line-height:2.1;color:var(--ink-soft)">
            <span class="kbd">⌘T</span> 新建终端标签 · <span class="kbd">⌘W</span> 关闭标签<br/>
            <span class="kbd">⌘F</span> 查找 · <span class="kbd">⌘J</span> AI 抽屉 · <span class="kbd">⌘D</span> 左右分屏<br/>
            <span class="kbd">Ctrl+L</span> shell 清屏（不拦截，透传）<br/>
            <span class="kbd">⌘1-9</span> 切换工作区（既有）<br/>
            <span class="mut" style="font-size:10.5px">浏览器端仅注册 ⌘F/⌘J，其余留按钮入口，不与浏览器行为抢键。</span>
          </div>
        </div>
      </div>
    </div>
  </div>` +
  decision(`<span class="w">按钮细节三原则</span> — ① <b>每个动作写清四件事</b>：点击行为、菜单明细、快捷键、禁用条件（统一 = 无任何会话，T8 的置灰态）；② <b>不新造快捷键</b>：⌘D/⌘W 仅桌面端注册（Electron 可拦截），浏览器端保留按钮入口，不与浏览器抢键；Ctrl+L 属 shell 原生永不拦截；③ <b>全部映射真实能力</b>：detach 90s、transcript 导出、统一传输、{CWD} 展开、网关资源采集——清屏遵守"不向 JumpServer shell 发不可见字符"的网关红线。`);
}

/* ============ 屏切换 ============ */
const SCREENS = {
  t1:{n:"T1 常规布局总览",d:"工具行 → 终端标签 → 终端 → 快捷命令 → 状态栏 · 全真实状态",f:t1},
  t2:{n:"T2 多标签 · 分屏",d:"终端内多会话标签 · 焦点窗格 · 分屏菜单",f:t2},
  t3:{n:"T3 查找 · 右键菜单",d:"⌘F 悬浮查找条 · 常规右键菜单",f:t3},
  t4:{n:"T4 断线与重连",d:"一行横幅 + 自动重试进度 · 零弹窗",f:t4},
  t5:{n:"T5 拖拽上传",d:"当前目录遮罩 · 统一传输体系",f:t5},
  t6:{n:"T6 AI 助手（抽屉）",d:"图标入口 · 引用选中 · 命令直发",f:t6},
  t7:{n:"T7 弹出独立窗口",d:"同会话跨窗口 · 主窗占位",f:t7},
  t8:{n:"T8 未连接空态",d:"单一主按钮 · 动作禁用态",f:t8},
  t9:{n:"T9 快捷命令管理",d:"常规 CRUD · 预设保护 · {CWD} 变量",f:t9},
  t10:{n:"T10 工具行动作明细",d:"每个按钮的行为 / 菜单 / 快捷键 / 禁用条件",f:t10},
};
const vp = document.getElementById("viewport");
if (location.search.includes("shot=1")) document.body.classList.add("shot");
function go(id){
  document.querySelectorAll("#index button").forEach(b=>b.classList.toggle("on",b.dataset.s===id));
  const meta = SCREENS[id];
  document.getElementById("d-n").textContent = meta.n;
  document.getElementById("d-d").textContent = meta.d;
  vp.innerHTML = `<div class="screen on">${meta.f()}</div>`;
  location.hash = id;
}
document.querySelectorAll("#index button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.s)));
const h = location.hash.slice(1);
go(SCREENS[h] ? h : "t1");
window.addEventListener("hashchange",()=>{ const id=location.hash.slice(1); if(SCREENS[id]) go(id); });
</script>
</body>
</html>
