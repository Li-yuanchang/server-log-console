<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Server Log Console — 空状态占位符 · 4 版原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;650;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --panel:#ffffff; --panel-muted:#f5f5f5; --bg:#fafafa;
  --ink:#171717; --ink-soft:#666666; --ink-muted:#8f8f8f;
  --line:#eaeaea; --line-strong:#d4d4d4;
  --accent:#0070f3; --accent-h:#0060df; --accent-soft:rgba(0,112,243,.08);
  --green-dot:#22c55e; --red:#d41313; --red-soft:rgba(212,19,19,.07); --amber:#b45309; --amber-soft:rgba(180,83,9,.09);
  --shell:#0a0a0a; --shell-soft:#111111; --shell-ink:#e8e8e8; --shell-mut:#5c6b7a; --shell-line:#21262d;
  --on-accent:#ffffff;
  --r-s:6px; --r-m:8px; --r-l:10px;
  --mono:"Geist Mono","SFMono-Regular","Menlo","Consolas",monospace;
  --font:"Geist","Inter",-apple-system,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --shadow-pop:0 12px 40px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.06);
  --ghost:color-mix(in srgb,var(--ink) 7%,transparent);
  --ghost-2:color-mix(in srgb,var(--ink) 11%,transparent);
}
#viewport.dark{
  --bg:#0a0a0a; --panel:#141414; --panel-muted:#1b1b1b;
  --ink:#ededed; --ink-soft:#a3a3a3; --ink-muted:#707070;
  --line:#262626; --line-strong:#3d3d3d;
  --accent:#3b82f6; --accent-h:#2f6fe4; --accent-soft:rgba(59,130,246,.16);
  --shadow-pop:0 16px 44px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);letter-spacing:-.01em;font-size:12.5px;color:var(--ink);background:#f0f0ee;display:flex;overflow:hidden}
svg{display:block;flex:none}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:none;cursor:pointer}
kbd{font-family:var(--mono)}

/* ---------- 索引 ---------- */
#index{flex:0 0 196px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;padding:12px 8px;gap:1px;overflow-y:auto}
#index h1{font-size:12px;font-weight:700;padding:4px 8px 2px}
#index .sub{font-size:10px;color:var(--ink-muted);padding:0 8px 10px;line-height:1.6;border-bottom:1px dashed var(--line);margin-bottom:8px}
#index button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 9px;font-size:12px;color:var(--ink-soft);text-align:left;border-radius:var(--r-s)}
#index button:hover{background:var(--panel-muted);color:var(--ink)}
#index button.on{background:var(--ink);color:#fff;font-weight:600}
#index .sid{font-family:var(--mono);font-size:9.5px;opacity:.6;width:16px}
#index .tag{margin-left:auto;font-size:9px;font-family:var(--mono);opacity:.55}
#index .foot{margin-top:auto;padding:10px 8px 4px;font-size:10px;color:var(--ink-muted);line-height:1.7;border-top:1px dashed var(--line)}

/* ---------- 舞台 ---------- */
#stage{flex:1;display:flex;flex-direction:column;min-width:0}
#desc{flex:none;display:flex;align-items:center;gap:12px;padding:9px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
#desc .n{font-weight:700;font-size:13px}
#desc .d{font-size:11.5px;color:var(--ink-muted);flex:1}
#skin-toggle{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
#skin-toggle button{height:22px;padding:0 10px;font-size:10.5px;color:var(--ink-soft)}
#skin-toggle button.on{background:var(--ink);color:#fff}
#viewport{flex:1;overflow-y:auto;background:var(--bg);position:relative;color:var(--ink)}
.page{display:none;padding:18px 22px 70px;max-width:1240px;margin:0 auto}
.page.on{display:block}

/* ---------- 章节标题 / 说明 ---------- */
.sec{display:flex;align-items:baseline;gap:10px;margin:30px 0 4px}
.sec:first-child{margin-top:4px}
.sec .no{font-family:var(--mono);font-size:10px;color:var(--accent);font-weight:600}
.sec b{font-size:14px;font-weight:650;letter-spacing:-.01em}
.sec span{font-size:11px;color:var(--ink-muted)}
.cap{font-size:11px;color:var(--ink-muted);margin:8px 2px 0;line-height:1.6}
.cap b{color:var(--ink-soft);font-weight:600}
.note{margin:10px 2px 0;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--panel);font-size:11px;color:var(--ink-soft);line-height:1.8}
.note b{color:var(--ink)}
.note ul{margin-left:16px}

/* ---------- 设计系统（与应用一致） ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 12px;font-size:12px;font-weight:500;
  border:1px solid var(--line);border-radius:var(--r-m);background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap;
  transition:background .15s ease,border-color .15s ease,color .15s ease,box-shadow .15s ease}
.btn:hover{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 26%,transparent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:550}
.btn.pri:hover{background:var(--accent-h);border-color:var(--accent-h);box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn.sm{height:24px;padding:0 9px;gap:5px;font-size:11px;border-radius:var(--r-s)}
.btn[disabled]{opacity:.45;cursor:default;pointer-events:none}
.kbd{font-family:var(--mono);font-size:10px;color:var(--ink-soft);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1.5px 5.5px;background:var(--panel);white-space:nowrap}
.kbd.dk{background:#1a1a1a;border-color:#2c2c2c;color:#c9d2dc;border-bottom-color:#111}
.chip{height:24px;padding:0 10px;border:1px solid var(--line);border-radius:999px;font-size:11px;background:var(--panel);display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);white-space:nowrap}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.dot{width:6px;height:6px;border-radius:999px;background:var(--green-dot);display:inline-block;flex:none}
.dot.idle{background:color-mix(in srgb,var(--ink) 22%,transparent)}
.dot.warn{background:#f5a623}

/* ---------- 应用窗口壳（1:1 复刻主界面） ---------- */
.app{position:relative;display:grid;grid-template-columns:198px 1fr;grid-template-rows:37px 1fr 27px;height:var(--fh,520px);
  background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 14px 36px rgba(0,0,0,.05)}
.side{grid-column:1;grid-row:1/3;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.main{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;min-width:0;min-height:0}
.status{grid-column:1/3;grid-row:3;border-top:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:10.5px;color:var(--ink-muted)}
.status .st-dot{width:6px;height:6px;border-radius:999px;background:#f5a623}
.status .st-pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;background:var(--panel-muted)}
.status .st-link{color:var(--accent);font-weight:550;cursor:pointer}
.status .ver{margin-left:auto;font-family:var(--mono);font-size:9.5px;opacity:.7}

/* 侧栏 */
.sb-head{height:37px;flex:none;display:flex;align-items:center;gap:7px;padding:0 11px}
.tl{width:10px;height:10px;border-radius:999px}
.tl.r{background:#ff5f57}.tl.y{background:#febc2e}.tl.g{background:#28c840}
.sb-head .gear{margin-left:auto;display:flex;gap:8px;color:var(--ink-muted)}
.sb-title{padding:10px 12px 7px;font-size:13.5px;font-weight:650;letter-spacing:-.01em}
.sb-cap{display:flex;justify-content:space-between;align-items:baseline;padding:0 12px 6px;font-size:10.5px;color:var(--ink-muted)}
.sb-cap b{font-weight:600;color:var(--ink-soft)}
.sb-search{margin:0 10px 9px;height:26px;flex:none;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--ink-muted);font-size:11px;background:var(--panel)}
.sb-groups{flex:1;overflow:hidden;padding-bottom:6px}
.sb-group{padding:7px 12px 3px;font-size:10px;color:var(--ink-muted);font-weight:600}
.sb-item{padding:4px 12px 4px 13px;display:flex;flex-direction:column;gap:1px;position:relative}
.sb-item.on{background:var(--panel-muted)}
.sb-item.on::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:2px;border-radius:2px;background:var(--accent)}
.sb-item .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sb-item .r1 .nm{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);min-width:0}
.sb-item .r1 .nm b{font-weight:450;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item.on .r1 .nm b{font-weight:650;color:var(--ink)}
.sb-item .pt{font-family:var(--mono);font-size:9.5px;color:var(--ink-muted)}
.sb-item .r2{padding-left:12px;font-family:var(--mono);font-size:9.5px;color:var(--ink-muted)}

/* 顶栏 */
.tbar{height:37px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--panel)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;background:var(--panel-muted);padding:2px;gap:2px}
.seg .tab{height:22px;padding:0 11px;font-size:11.5px;color:var(--ink-soft);border-radius:6px;display:inline-flex;align-items:center}
.seg .tab.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.02)}
.crumb{font-family:var(--mono);font-size:11px;color:var(--ink-soft);border:1px solid var(--line);border-radius:6px;padding:3px 9px;background:var(--panel)}
.tbar .sp{flex:1}
.tin{height:26px;width:170px;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:11px;color:var(--ink-muted);background:var(--panel)}
.tbtn{width:26px;height:26px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;color:var(--ink-soft);background:var(--panel)}
.content{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}

/* ---------- 方案 A · 引导式工作台 ---------- */
.ea{height:100%;overflow:auto;padding:40px 48px 28px;display:flex;justify-content:center}
.ea-wrap{width:640px}
.ea-eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.06em;color:var(--accent);font-weight:600;
  border:1px solid color-mix(in srgb,var(--accent) 24%,transparent);border-radius:999px;padding:3px 10px;background:var(--accent-soft)}
.ea-title{font-size:19px;font-weight:650;letter-spacing:-.02em;margin:13px 0 5px}
.ea-sub{font-size:12.5px;color:var(--ink-soft);line-height:1.6}
.ea-steps{margin-top:20px;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.ea-step{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.ea-step:last-child{border-bottom:none}
.ea-num{width:22px;height:22px;flex:none;border-radius:999px;background:var(--panel-muted);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;color:var(--ink-soft)}
.ea-tx{min-width:0}
.ea-tx b{display:block;font-size:12.5px;font-weight:600}
.ea-tx span{font-size:11px;color:var(--ink-muted)}
.ea-step .btn{margin-left:auto}
.ea-arr{margin-left:auto;color:var(--ink-muted);font-size:12px}
.ea-step.cur{background:var(--accent-soft)}
.ea-step.cur .ea-num{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.ea-foot{display:flex;justify-content:space-between;gap:28px;margin-top:16px}
.ea-lab{font-size:10px;color:var(--ink-muted);font-weight:600;letter-spacing:.05em;margin-bottom:7px}
.ea-chips{display:flex;gap:6px;flex-wrap:wrap}
.ea-keys{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink-soft)}
.ea-keys .kbd{margin-right:4px}

/* ---------- 方案 B · 画布徽章 ---------- */
.eb{position:relative;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.eb::before{content:"";position:absolute;inset:0;
  background-image:radial-gradient(color-mix(in srgb,var(--ink) 16%,transparent) 1px,transparent 1.3px);
  background-size:22px 22px;
  -webkit-mask-image:radial-gradient(ellipse 72% 64% at 50% 46%,#000 26%,transparent 76%);
  mask-image:radial-gradient(ellipse 72% 64% at 50% 46%,#000 26%,transparent 76%);
  opacity:.55}
.eb::after{content:"";position:absolute;width:460px;height:280px;left:50%;top:45%;transform:translate(-50%,-50%);
  background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 8%,transparent),transparent);filter:blur(6px)}
.eb-card{position:relative;width:300px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow-pop);padding:22px 24px 18px;display:flex;flex-direction:column;align-items:center;text-align:center}
.eb-ic{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;color:var(--ink-soft);background:var(--panel-muted);margin-bottom:12px}
.eb-card>b{font-size:13.5px;font-weight:650}
.eb-card>span{font-size:11.5px;color:var(--ink-muted);line-height:1.55;margin-top:4px}
.eb-act{display:flex;align-items:center;gap:8px;margin-top:14px}
.eb-meta{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);font-size:10.5px;color:var(--ink-muted);width:100%}
.eb-meta b{color:var(--ink-soft);font-weight:600}

/* ---------- 方案 C · 终端拟态 ---------- */
.ec{height:100%;padding:14px 16px;display:flex}
.ec-term{flex:1;background:var(--shell);border-radius:10px;position:relative;overflow:hidden;font-family:var(--mono);display:flex;flex-direction:column;box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}
.ec-head{display:flex;align-items:center;gap:5px;padding:9px 12px;border-bottom:1px solid var(--shell-line);color:var(--shell-mut);font-size:10px;flex:none}
.ec-head i{width:9px;height:9px;border-radius:999px;background:#2a3038}
.ec-head span{margin-left:6px}
.ec-head em{margin-left:auto;font-style:normal;color:#3d4754}
.ec-lines{padding:14px 16px 6px;display:flex;flex-direction:column;gap:8px;font-size:11.5px;line-height:1.5}
.ec-line{display:flex;gap:10px;align-items:baseline;color:#8b96a5}
.ec-line .t{color:#454f5b;font-size:10.5px}
.ec-lv{width:34px;flex:none;text-align:center;font-size:9px;padding:1px 0;border-radius:4px;border:1px solid #26303c;color:#5c6b7a;letter-spacing:.05em}
.ec-lv.cmd{color:#e8e8e8;border-color:transparent;width:auto}
.ec-line .m{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ec-line.dim{color:#454f5b}
.ec-line .lit{color:#d7dde5}
.ec-line .ph{color:#5c6b7a;font-style:normal;border-bottom:1px dashed #3a4450}
.ec-caret{display:inline-block;width:7px;height:12px;background:#e8e8e8;vertical-align:-2px;margin-left:2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ec-cta{position:absolute;left:50%;bottom:21%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:9px;height:30px;padding:0 14px;border-radius:999px;
  background:#161616;border:1px solid #2c2c2c;color:#e8e8e8;font-size:12px;font-family:var(--font);white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.ec-cta:hover{background:#1f1f1f;border-color:#3a3a3a}
.ec-corner{position:absolute;right:13px;bottom:12px;font-size:9.5px;color:#3d4754;display:flex;gap:10px}

/* ---------- 方案 D · 形状幽灵 ---------- */
.ed{position:relative;height:100%;overflow:hidden}
.ed-ghost{position:absolute;inset:24px 30px 20px;display:flex;flex-direction:column;gap:14px}
.ed-row{display:grid;grid-template-columns:14px 1fr 52px 70px;gap:16px;align-items:center;height:20px;flex:none}
.ed-row.log{grid-template-columns:56px 34px 1fr}
.ed-row .bar{position:relative;overflow:hidden;height:7px;border-radius:4px;background:var(--ghost)}
.ed-row .bar::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ink) 5%,transparent),transparent);
  animation:shim 2.8s ease infinite}
@keyframes shim{60%{transform:translateX(100%)}100%{transform:translateX(100%)}}
.ed-row:nth-child(2n) .bar::after{animation-delay:.4s}
.ed-row:nth-child(3n) .bar::after{animation-delay:.9s}
.ed-row:nth-child(5n) .bar::after{animation-delay:1.5s}
.ed-pill{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:12px;
  padding:10px 12px 10px 13px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-pop)}
.ed-ic{width:30px;height:30px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;color:var(--ink-soft);background:var(--panel-muted)}
.ed-pill .tx b{display:block;font-size:12.5px;font-weight:650}
.ed-pill .tx span{font-size:10.5px;color:var(--ink-muted)}
.ed-pill .btn{margin-left:4px}
.ed-drop{position:absolute;inset:22px 30px 20px;border:1.5px dashed var(--line-strong);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:color-mix(in srgb,var(--panel) 40%,transparent)}
.ed-drop .ed-ic{width:38px;height:38px;border-radius:11px;margin-bottom:6px}
.ed-drop b{font-size:12.5px;font-weight:650}
.ed-drop span{font-size:11px;color:var(--ink-muted)}
.ed-drop .eb-act{margin-top:12px}

/* ---------- 小态（下拉 / 抽屉 / 面板） ---------- */
.minis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px}
.mini{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;display:flex;flex-direction:column}
.mini-h{height:30px;flex:none;display:flex;align-items:center;gap:7px;padding:0 10px;border-bottom:1px solid var(--line);font-size:11px;font-weight:600;color:var(--ink-soft)}
.mini-b{flex:1;min-height:118px;position:relative;display:flex}
.mini-cap{padding:7px 10px;border-top:1px dashed var(--line);font-size:10px;color:var(--ink-muted);line-height:1.5}
/* A 小态：左对齐小卡 */
.em-a{flex:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:5px;padding:12px 14px}
.em-a .ic{width:26px;height:26px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;color:var(--ink-soft);background:var(--panel-muted);margin-bottom:2px}
.em-a b{font-size:12px;font-weight:600}
.em-a span{font-size:10.5px;color:var(--ink-muted);line-height:1.5}
.em-a .btn{margin-top:6px}
/* B 小态：居中一行 */
.em-b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px;text-align:center;color:var(--ink-muted)}
.em-b .ic{color:var(--ink-muted);opacity:.8;margin-bottom:2px}
.em-b b{font-size:11.5px;font-weight:600;color:var(--ink-soft)}
.em-b span{font-size:10.5px;line-height:1.5}
/* C 小态：mono 分隔线 */
.em-c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;font-family:var(--mono);color:#5c6b7a}
.em-c .ln{font-size:11px;display:flex;align-items:center;gap:8px}
.em-c .ln::before,.em-c .ln::after{content:"";width:26px;height:1px;background:#26303c}
.em-c .sub{font-family:var(--font);font-size:10px;color:var(--ink-muted)}
/* D 小态：幽灵 + 文字 */
.em-d{flex:1;position:relative;display:flex;flex-direction:column;gap:12px;padding:16px 16px}
.em-d .bar{position:relative;overflow:hidden;height:7px;border-radius:4px;background:var(--ghost)}
.em-d .bar::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ink) 5%,transparent),transparent);animation:shim 2.8s ease infinite}
.em-d .tx{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--panel);opacity:.92;text-align:center}
.em-d .tx b{font-size:11px;font-weight:600;color:var(--ink-soft)}
.em-d .tx span{font-size:10px;color:var(--ink-muted)}

/* ---------- 场景总览 ---------- */
.diag{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 6px}
.diag .dcard{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:13px 15px}
.diag .dcard b{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:650;margin-bottom:5px}
.diag .dcard b .no{font-family:var(--mono);font-size:9.5px;color:var(--red);border:1px solid color-mix(in srgb,var(--red) 30%,transparent);background:var(--red-soft);border-radius:999px;padding:1px 7px}
.diag .dcard p{font-size:11.5px;color:var(--ink-soft);line-height:1.7}
.prin{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0 4px}
.prin .pcard{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:13px 15px}
.prin .pcard .pn{font-family:var(--mono);font-size:10px;color:var(--accent);font-weight:600;margin-bottom:6px}
.prin .pcard b{display:block;font-size:12px;font-weight:650;margin-bottom:4px}
.prin .pcard p{font-size:10.5px;color:var(--ink-soft);line-height:1.65}
table.inv{width:100%;border-collapse:collapse;margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);font-size:11px}
.inv thead th{text-align:left;font-size:10px;color:var(--ink-muted);font-weight:600;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel-muted)}
.inv td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
.inv tr:last-child td{border-bottom:none}
.inv td.no{font-family:var(--mono);color:var(--ink-muted);font-size:10px;width:26px}
.inv td.zone{color:var(--ink-soft);font-weight:600;white-space:nowrap}
.inv td.sense b{font-weight:600}
.inv td.sense span{display:block;color:var(--ink-muted);font-size:10px}
.inv td.copy{font-family:var(--mono);font-size:10px;color:var(--ink-soft)}
.inv td.lvl{white-space:nowrap}
.inv .hot{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;color:var(--red);border:1px solid color-mix(in srgb,var(--red) 26%,transparent);background:var(--red-soft);border-radius:999px;padding:1px 7px;font-weight:600}
.inv .mid{display:inline-flex;align-items:center;font-size:9.5px;color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 26%,transparent);background:var(--amber-soft);border-radius:999px;padding:1px 7px}
.inv .sml{display:inline-flex;align-items:center;font-size:9.5px;color:var(--ink-muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px}

/* 双列布局（中幅场景） */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.duo .app{--fh:400px}
@media (max-width:1120px){.duo{grid-template-columns:1fr}}
</style>

<script>

  {g:"服务器",items:[{n:"127.31",ip:"192.168.127.31",p:22},{n:"127.32",ip:"192.168.127.32",p:22},{n:"2.90",ip:"192.168.2.90",p:22}]},
  {g:"开发",items:[{n:"2.208",ip:"192.168.2.208",p:22}]},

function sidebarHtml(){
  let h=`<div class="sb-head"><span class="tl r"></span><span class="tl y"></span><span class="tl g"></span>

    h+=`<div class="sb-group">${g.g}</div>`;

      h+=`<div class="sb-item${it.on?" on":""}"><div class="r1"><span class="nm"><i class="dot${it.on?"":" idle"}"></i><b>${it.n}</b></span><span class="pt">${it.p}</span></div><div class="r2">${it.ip}</div></div>`;

}

    b:`<div class="em-b" style="padding:22px 12px"><span class="ic">${ic("server",14)}</span><b>还没有服务器</b><span>导入 FinalShell 连接后<br/>自动出现在这里</span></div>`,
    c:`<div class="em-c" style="padding:22px 12px"><span class="ln">暂无服务器</span><span class="sub">$ import --from finalshell</span></div>`,
    d:`<div class="em-d" style="padding:16px 12px"><i class="bar" style="width:70%"></i><i class="bar" style="width:52%"></i><i class="bar" style="width:63%"></i><div class="tx"><b>还没有服务器</b><span>导入 FinalShell 连接</span></div></div>`

function topbarHtml(mode){
  return `<div class="seg"><span class="tab${mode==="log"?" on":""}">日志预览</span><span class="tab${mode==="files"?" on":""}">文件目录</span></div>

/* ================= 方案 A 内容 ================= */

const A={

    </div>
  </div></div>`,
  term:()=>`<div class="ea"><div class="ea-wrap">
    <span class="ea-eyebrow">${ic("term",11)} 终端 · 空会话</span>
    <div class="ea-title">未建立终端会话</div>

/* ================= 方案 C 内容 ================= */
function ecFrame(lines,cta,kbd){
  return `<div class="ec"><div class="ec-term">
    <div class="ec-head"><i></i><i></i><i></i><span>slcc — log console</span><em>guest@local</em></div>

    <button class="ec-cta">${cta}${kbd?`<span class="kbd dk">${kbd}</span>`:""}</button>
    <div class="ec-corner"><span>SSH</span><span>·</span><span>等待中</span></div>
  </div></div>`;
}
const C={
  wait:()=>ecFrame(`
    <div class="ec-line"><span class="t">19:13:02</span><span class="lv">SYS</span><span class="m">系统就绪，等待建立连接</span></div>

    <div class="ec-line"><span class="t">19:13:05</span><span class="lv cmd">$</span><span class="m lit">connect --server=<i class="ph">?</i><i class="ec-caret"></i></span></div>`,
    `选择服务器`,"⌘K"),

  <div class="note">${suitNote}<br/>${heroNote}</div>

  <div class="sec"><span class="no">${v.toUpperCase()}.1</span><b>文件目录 · 等待选择服务器</b><span>场景 01（截图同款 · 大屏痛点）</span></div>
  <div style="margin-top:12px">${frame(C4.wait(),{mode:"files"})}</div>
  <div class="cap">同版式也覆盖 <b>场景 02 连接中</b>（标题换「正在连接 {name}」，步骤 1 变进度行）与 <b>场景 06 服务离线</b>（步骤换「检查服务 / 连接服务设置」）。</div>

  <div class="sec"><span class="no">${v.toUpperCase()}.2</span><b>日志预览 · 还没有检索结果</b><span>场景 03（大屏痛点）</span></div>
  <div style="margin-top:12px">${frame(C4.search(),{mode:"log"})}</div>

  <div class="sec"><span class="no">${v.toUpperCase()}.3</span><b>终端 · 未建立会话</b><span>场景 08（大屏痛点）</span></div>
  <div style="margin-top:12px">${frame(C4.term(),{mode:"files",status:"请先选择服务器"})}</div>
  <div class="cap">${termNote}</div>

  <div class="sec"><span class="no">${v.toUpperCase()}.4</span><b>文件目录 · 目录为空</b><span>场景 04 / 05（中屏）</span></div>
  <div style="margin-top:12px">${frame(C4.dirempty(),{mode:"files",status:"/data/apps/logs"})}</div>
  <div class="cap">${dirNote} 场景 05 加载中沿用本版式，内容区换 spinner。</div>

  <div class="sec"><span class="no">${v.toUpperCase()}.5</span><b>启动 · 还没有服务器</b><span>场景 07（大屏痛点）· 侧栏同步空态（场景 09）</span></div>
  <div style="margin-top:12px">${frame(C4.noservers(),{mode:"files",sbEmpty:v,status:"0 台服务器"})}</div>
  <div class="cap">${nsNote}</div>

  <div class="sec"><span class="no">${v.toUpperCase()}.6</span><b>小态适配</b><span>场景 12 / 15 / 18 / 20 / 25（下拉 · 抽屉 · 面板 · 图表）</span></div>
  ${minisHtml(v)}
  <div class="cap">小态规格：图标 26px tile（A）/ 裸 15px（B）/ mono 分隔线（C）/ 幽灵行 + 覆盖文字（D），均 <b>不再使用大屏三件套</b>。</div>`;
}

/* ================= 渲染 ================= */
document.getElementById("p0").innerHTML=page0();
document.getElementById("pa").innerHTML=buildVersionPage("a","引导式工作台","把空态变成可执行的上手清单 · 信息量最大","<b>适合：</b>首次启动、未选服务器、无服务器等「需要教用户下一步」的场景；对老用户则提供键位与最近连接捷径。");
document.getElementById("pb").innerHTML=buildVersionPage("b","画布徽章","极简派 · 留白有意图，行动聚焦唯一主按钮","<b>适合：</b>日常高频空态（未选服务器 / 目录为空 / 无会话）；改动成本最低——保留现有居中心智，只加底纹、收窄卡片、补捷径。");
document.getElementById("pc").innerHTML=buildVersionPage("c","终端拟态","品牌派 · 空区即终端，用产品自己的语言等待","<b>适合：</b>等待类场景（连接中 / 终端 / 检索跟随）；深色 shell 与日志视图同源，亮色主题下也成立（日志区本就是深底）。");
document.getElementById("pd").innerHTML=buildVersionPage("d","形状幽灵","预告派 · 骨架占位，空间被「未来内容」填满","<b>适合：</b>加载 / 采样 / 列表空态；骨架行宽窄错落 + 缓速微光，暗示内容形状但不假装在加载（空目录用拖放区变体）。");

/* 导航 */
const DESC={
  p0:["00","梳理全部空占位场景 → 问题诊断 → 共同设计原则"],
  pa:["A 引导式工作台","锚定顶部 + 三步引导 + 最近连接 / 键位捷径 · 信息量最大"],
  pb:["B 画布徽章","点阵画布 + 聚光渐晕 + 300px 紧凑卡 · 极简聚焦"],
  pc:["C 终端拟态","深色 shell + mono 日志行 + 闪烁光标 · 品牌语境"],
  pd:["D 形状幽灵","骨架行预示内容形状 + 中央悬浮胶囊 · 空间预告"]
};
document.querySelectorAll("#index button").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll("#index button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("on"));
    document.getElementById(b.dataset.page).classList.add("on");
    const d=DESC[b.dataset.page];
    document.getElementById("desc-n").textContent=d[0];
    document.getElementById("desc-d").textContent=d[1];
    document.getElementById("viewport").scrollTop=0;
  });
});
document.querySelectorAll("#skin-toggle button").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll("#skin-toggle button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    document.getElementById("viewport").classList.toggle("dark",b.dataset.skin==="dark");
  });
});
/* URL hash 直达：#pa / #pb / #pc / #pd / #p0，可选暗色后缀 -dark（如 #pc-dark） */
(function(){
  const h=location.hash.replace("#","");
  if(!h)return;
  const [pg,skin]=h.split("-");
  const nav=document.querySelector(`#index button[data-page="${pg}"]`);
  if(nav)nav.click();
  if(skin==="dark")document.querySelector('#skin-toggle button[data-skin="dark"]').click();
})();
</script>
