<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Server Log Console — 空状态方案 A · v2 优化稿</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;650;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --panel:#ffffff; --panel-muted:#f5f5f5; --bg:#fafafa;
  --ink:#171717; --ink-soft:#666666; --ink-muted:#8f8f8f;
  --line:#eaeaea; --line-strong:#d4d4d4;
  --accent:#0070f3; --accent-h:#0060df; --accent-soft:rgba(0,112,243,.08);
  --green-dot:#22c55e; --red:#d41313; --red-soft:rgba(212,19,19,.07); --amber:#b45309; --amber-soft:rgba(180,83,9,.09);
  --shell:#0a0a0a; --shell-soft:#111111; --shell-ink:#e8e8e8; --shell-mut:#5c6b7a; --shell-line:#21262d;
  --on-accent:#ffffff;
  --r-s:6px; --r-m:8px; --r-l:10px;
  --mono:"Geist Mono","SFMono-Regular","Menlo","Consolas",monospace;
  --font:"Geist","Inter",-apple-system,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --shadow-pop:0 12px 40px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.06);
}
#viewport.dark{
  --bg:#0a0a0a; --panel:#141414; --panel-muted:#1b1b1b;
  --ink:#ededed; --ink-soft:#a3a3a3; --ink-muted:#707070;
  --line:#262626; --line-strong:#3d3d3d;
  --accent:#3b82f6; --accent-h:#2f6fe4; --accent-soft:rgba(59,130,246,.16);
  --shadow-pop:0 16px 44px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);letter-spacing:-.01em;font-size:12.5px;color:var(--ink);background:#f0f0ee;display:flex;overflow:hidden}
svg{display:block;flex:none}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:none;cursor:pointer}
kbd{font-family:var(--mono)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- 索引 ---------- */
#index{flex:0 0 196px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;padding:12px 8px;gap:1px;overflow-y:auto}
#index h1{font-size:12px;font-weight:700;padding:4px 8px 2px}
#index .sub{font-size:10px;color:var(--ink-muted);padding:0 8px 10px;line-height:1.6;border-bottom:1px dashed var(--line);margin-bottom:8px}
#index button{display:flex;align-items:center;gap:8px;width:100%;padding:5.5px 9px;font-size:12px;color:var(--ink-soft);text-align:left;border-radius:var(--r-s)}
#index button:hover{background:var(--panel-muted);color:var(--ink)}
#index button.on{background:var(--ink);color:#fff;font-weight:600}
#index .sid{font-family:var(--mono);font-size:9.5px;opacity:.6;width:16px}
#index .foot{margin-top:auto;padding:10px 8px 4px;font-size:10px;color:var(--ink-muted);line-height:1.7;border-top:1px dashed var(--line)}

/* ---------- 舞台 ---------- */
#stage{flex:1;display:flex;flex-direction:column;min-width:0}
#desc{flex:none;display:flex;align-items:center;gap:12px;padding:9px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
#desc .n{font-weight:700;font-size:13px;white-space:nowrap}
#desc .d{font-size:11.5px;color:var(--ink-muted);flex:1}
#skin-toggle{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
#skin-toggle button{height:22px;padding:0 10px;font-size:10.5px;color:var(--ink-soft)}
#skin-toggle button.on{background:var(--ink);color:#fff}
#viewport{flex:1;overflow-y:auto;background:var(--bg);position:relative;color:var(--ink)}
.page{display:none;padding:18px 22px 70px;max-width:1240px;margin:0 auto}
.page.on{display:block}

/* ---------- 章节 ---------- */
.sec{display:flex;align-items:baseline;gap:10px;margin:22px 0 4px}
.sec:first-child{margin-top:4px}
.sec .no{font-family:var(--mono);font-size:10px;color:var(--accent);font-weight:600}
.sec b{font-size:14px;font-weight:650;letter-spacing:-.01em}
.sec span{font-size:11px;color:var(--ink-muted)}
.cap{font-size:11px;color:var(--ink-muted);margin:8px 2px 0;line-height:1.7}
.cap b{color:var(--ink-soft);font-weight:600}
.note{margin:10px 2px 0;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--panel);font-size:11px;color:var(--ink-soft);line-height:1.8}
.note b{color:var(--ink)}

/* ---------- 设计系统 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 12px;font-size:12px;font-weight:500;
  border:1px solid var(--line);border-radius:var(--r-m);background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap;
  transition:background .15s ease,border-color .15s ease,color .15s ease,box-shadow .15s ease}
.btn:hover{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 26%,transparent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:550}
.btn.pri:hover{background:var(--accent-h);border-color:var(--accent-h);box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn.sm{height:24px;padding:0 9px;gap:5px;font-size:11px;border-radius:var(--r-s)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-soft)}
.btn.ghost:hover{background:var(--panel-muted);border-color:var(--line)}
.kbd{font-family:var(--mono);font-size:10px;color:var(--ink-soft);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1.5px 5.5px;background:var(--panel);white-space:nowrap}
.chip{height:24px;padding:0 10px;border:1px solid var(--line);border-radius:999px;font-size:11px;background:var(--panel);display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);white-space:nowrap}
.dot{width:6px;height:6px;border-radius:999px;background:var(--green-dot);display:inline-block;flex:none}
.dot.idle{background:color-mix(in srgb,var(--ink) 22%,transparent)}
.dot.accent{background:var(--accent)}
.dot.red{background:var(--red)}

/* ---------- 应用窗口壳 ---------- */
.app{position:relative;display:grid;grid-template-columns:198px 1fr;grid-template-rows:37px 1fr 27px;height:var(--fh,520px);
  background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 14px 36px rgba(0,0,0,.05)}
.app.narrow{grid-template-columns:1fr}
.side{grid-column:1;grid-row:1/3;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.main{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;min-width:0;min-height:0}
.app.narrow .main{grid-column:1}
.status{grid-column:1/3;grid-row:3;border-top:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:10.5px;color:var(--ink-muted)}
.app.narrow .status{grid-column:1}
.status .st-dot{width:6px;height:6px;border-radius:999px;background:#f5a623}
.status .st-dot.ok{background:var(--green-dot)}
.status .st-dot.err{background:var(--red)}
.status .st-pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;background:var(--panel-muted)}
.status .st-link{color:var(--accent);font-weight:550;cursor:pointer}
.status .ver{margin-left:auto;font-family:var(--mono);font-size:9.5px;opacity:.7}

/* 侧栏 */
.sb-head{height:37px;flex:none;display:flex;align-items:center;gap:7px;padding:0 11px}
.tl{width:10px;height:10px;border-radius:999px}
.tl.r{background:#ff5f57}.tl.y{background:#febc2e}.tl.g{background:#28c840}
.sb-head .gear{margin-left:auto;display:flex;gap:8px;color:var(--ink-muted)}
.sb-title{padding:10px 12px 7px;font-size:13.5px;font-weight:650;letter-spacing:-.01em}
.sb-cap{display:flex;justify-content:space-between;align-items:baseline;padding:0 12px 6px;font-size:10.5px;color:var(--ink-muted)}
.sb-cap b{font-weight:600;color:var(--ink-soft)}
.sb-search{margin:0 10px 9px;height:26px;flex:none;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--ink-muted);font-size:11px;background:var(--panel)}
.sb-groups{flex:1;overflow:hidden;padding-bottom:6px}
.sb-group{padding:7px 12px 3px;font-size:10px;color:var(--ink-muted);font-weight:600}
.sb-item{padding:4px 12px 4px 13px;display:flex;flex-direction:column;gap:1px;position:relative}
.sb-item.on{background:var(--panel-muted)}
.sb-item.on::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:2px;border-radius:2px;background:var(--accent)}
.sb-item .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sb-item .r1 .nm{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);min-width:0}
.sb-item .r1 .nm b{font-weight:450;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item.on .r1 .nm b{font-weight:650;color:var(--ink)}
.sb-item .pt{font-family:var(--mono);font-size:9.5px;color:var(--ink-muted)}
.sb-item .r2{padding-left:12px;font-family:var(--mono);font-size:9.5px;color:var(--ink-muted)}

/* 顶栏 */
.tbar{height:37px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--panel)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;background:var(--panel-muted);padding:2px;gap:2px}
.seg .tab{height:22px;padding:0 11px;font-size:11.5px;color:var(--ink-soft);border-radius:6px;display:inline-flex;align-items:center}
.seg .tab.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.02)}
.crumb{font-family:var(--mono);font-size:11px;color:var(--ink-soft);border:1px solid var(--line);border-radius:6px;padding:3px 9px;background:var(--panel)}
.tbar .sp{flex:1}
.tin{height:26px;width:170px;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:11px;color:var(--ink-muted);background:var(--panel)}
.tbtn{width:26px;height:26px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;color:var(--ink-soft);background:var(--panel)}
.svpill{height:26px;display:inline-flex;align-items:center;gap:7px;padding:0 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:11px;color:var(--ink);font-weight:550}
.content{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}

/* ================= A-v2 工作台 ================= */
.wa{height:100%;overflow:auto;padding:42px 46px 28px;display:flex;justify-content:center;position:relative}
/* 顶部极淡聚光：给内容一个「锚」 */
.wa::before{content:"";position:absolute;inset:0 0 auto 0;height:190px;pointer-events:none;
  background:radial-gradient(58% 130% at 50% 0%,color-mix(in srgb,var(--accent) 5%,transparent),transparent 70%)}
.wa-grid{position:relative;width:800px;display:grid;grid-template-columns:minmax(0,1fr) 266px;gap:22px;align-content:start}
.wa-grid.no-side{grid-template-columns:minmax(0,1fr)}
.wa-grid.narrow{width:520px;grid-template-columns:1fr}

.wa-eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.06em;color:var(--accent);font-weight:600;
  border:1px solid color-mix(in srgb,var(--accent) 24%,transparent);border-radius:999px;padding:3px 10px;background:var(--accent-soft)}
.wa-title{font-size:20px;font-weight:650;letter-spacing:-.02em;margin:13px 0 5px}
.wa-sub{font-size:12.5px;color:var(--ink-soft);line-height:1.65;max-width:46em}

/* 步骤时间线 */
.wa-steps{margin-top:20px;border:1px solid var(--line);border-radius:12px;background:var(--panel);position:relative;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.wa-steps::before{content:"";position:absolute;left:27px;top:24px;bottom:24px;width:1px;background:var(--line)}
.wa-step{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;border-bottom:1px solid var(--line)}
.wa-step:last-child{border-bottom:none}
.st-num{position:relative;z-index:1;width:24px;height:24px;flex:none;border-radius:999px;background:var(--panel);border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;color:var(--ink-soft)}
.wa-step.cur .st-num{background:var(--accent);color:var(--on-accent);border-color:var(--accent);animation:pulse 2.2s ease-out infinite}
.wa-step.cur{background:var(--accent-soft)}
.wa-step.cur{border-radius:0}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 32%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.st-num.done{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.st-num.wait{border-color:transparent;background:transparent}
.st-num.wait::before{content:"";width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wa-tx{min-width:0}
.wa-tx b{display:block;font-size:12.5px;font-weight:600}
.wa-tx span{font-size:11px;color:var(--ink-muted);line-height:1.5}
.wa-step .btn,.wa-step .wa-arr{margin-left:auto;flex:none}
.wa-arr{color:var(--ink-muted);font-size:12px}

/* 实时状态行（连接中） */
.live{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:6px 11px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;max-width:100%}
.live .dot{animation:pulse 1.6s ease-out infinite}
.ellip::after{content:"";animation:dots 1.2s steps(1) infinite}
@keyframes dots{0%{content:""}25%{content:"·"}50%{content:"··"}75%{content:"···"}}

/* 键位行 */
.wa-keys{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-soft)}
.wa-keys .kbd{margin-right:4px}

/* 右栏：情境面板 */
.wsp{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.wsp-h{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--line);font-size:11px;font-weight:600;color:var(--ink-soft)}
.wsp-h a{font-size:10.5px;color:var(--accent);font-weight:550;cursor:pointer;text-decoration:none}
.wsp-h a:hover{text-decoration:underline}
.rc-row{display:flex;align-items:center;gap:9px;padding:8.5px 12px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s ease,border-color .12s ease}
.rc-row:last-child{border-bottom:none}
.rc-row:hover,.rc-row.hover{background:var(--accent-soft)}
.rc-row:hover .rc-go,.rc-row.hover .rc-go{opacity:1;transform:none}
.rc-row .rc-nm{min-width:0;flex:1}
.rc-row .rc-nm b{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:550;color:var(--ink)}
.rc-row .rc-nm span{display:block;font-family:var(--mono);font-size:9.5px;color:var(--ink-muted);margin-top:1px}
.rc-go{opacity:0;transform:translateX(-3px);transition:all .15s ease;color:var(--accent);font-size:11px}
.rc-time{font-size:9.5px;color:var(--ink-muted);flex:none}
.tip{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel-muted);padding:11px 12px;display:flex;gap:9px;font-size:10.5px;color:var(--ink-soft);line-height:1.65}
.tip .ic{width:24px;height:24px;flex:none;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.tip a{color:var(--accent);font-weight:550;cursor:pointer;white-space:nowrap}

/* 入场动效 */
.rv{opacity:0;transform:translateY(8px);animation:rise .5s cubic-bezier(.2,.7,.3,1) forwards}
.d1{animation-delay:.03s}.d2{animation-delay:.09s}.d3{animation-delay:.15s}.d4{animation-delay:.21s}.d5{animation-delay:.27s}.d6{animation-delay:.33s}
@keyframes rise{to{opacity:1;transform:none}}

/* 小态 · 内联档（极窄下拉 / 单行占位） */
.minis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px}
.mini{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;display:flex;flex-direction:column}
.mini-h{height:30px;flex:none;display:flex;align-items:center;gap:7px;padding:0 10px;border-bottom:1px solid var(--line);font-size:11px;font-weight:600;color:var(--ink-soft)}
.mini-b{flex:1;min-height:118px;position:relative;display:flex}
.mini-cap{padding:7px 10px;border-top:1px dashed var(--line);font-size:10px;color:var(--ink-muted);line-height:1.5}
.em-a{flex:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:5px;padding:12px 14px}
.em-a .ic{width:26px;height:26px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;color:var(--ink-soft);background:var(--panel-muted);margin-bottom:2px}
.em-a b{font-size:12px;font-weight:600}
.em-a span{font-size:10.5px;color:var(--ink-muted);line-height:1.5}
.em-a .btn{margin-top:6px}

/* ---------- SP 移动档（≤560px 容器查询对应的真实结构） ---------- */
.app.narrow{display:flex;flex-direction:column}
.app.narrow .main{flex:1;display:flex;flex-direction:column;min-height:0}
.app.narrow .content{flex:1}
.app.narrow .status{display:none}
.sp-appbar{flex:none;height:40px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.sp-appbar .tbtn{border-radius:999px;flex:none}
.srv-chip{flex:1;min-width:0;display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-s);font-size:12px;font-weight:600;color:var(--ink);cursor:pointer}
.srv-chip:hover{border-color:var(--line-strong)}
.srv-chip .cdot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--green-dot);box-shadow:0 0 0 3px color-mix(in srgb,var(--green-dot) 14%,transparent)}
.srv-chip .cdot.idle{background:color-mix(in srgb,var(--ink) 28%,transparent);box-shadow:none}
.srv-chip .cname{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srv-chip .chost{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srv-chip .ccaret{flex:none;color:var(--ink-muted);font-size:9px}
.sp-statusbar{display:none}   /* v2.1 移除：400px 下过挤，连接概览并入 srv-chip 弹层 */
.sp-tabbar{flex:none;display:flex;border-top:1px solid var(--line);background:var(--panel);height:54px}
.sp-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--ink-muted);cursor:pointer;border:none;background:none;font-family:var(--font)}
.sp-tab .ic{width:36px;height:24px;display:grid;place-items:center;border-radius:8px;transition:background .15s ease}
.sp-tab.on{color:var(--accent);font-weight:600}
.sp-tab.on .ic{background:var(--accent-soft)}
.sp-tab[disabled]{opacity:.38;cursor:default}
/* 窄档内容压缩 */
.app.narrow .wa{padding:24px 20px 18px}
.app.narrow .wa-grid{width:100%;gap:0}
.app.narrow .wa-title{font-size:16.5px;margin:11px 0 4px}
.app.narrow .wa-sub{font-size:11.5px}
.app.narrow .wa-steps{margin-top:15px}
.app.narrow .wa-step{padding:10px 12px}
.app.narrow .wa-tx span{font-size:10.5px}
.app.narrow .wa-keys{display:none}   /* 触屏宿主无键盘：键位行隐藏 */
.sp-cta{display:flex;gap:8px;margin-top:14px}
.sp-cta .btn{flex:1;height:32px;font-size:12.5px}
.wn-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.wn-hint{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink-muted);line-height:1.65}
.wn-hint a{color:var(--accent);font-weight:550}
/* 小态 · 内联档（极窄下拉 / 单行占位） */
.em-inline{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 12px;color:var(--ink-muted);font-size:10.5px;text-align:center}
.em-inline b{color:var(--ink-soft);font-weight:550}
.em-inline .ic{color:var(--ink-muted);opacity:.75}

/* ---------- 底部状态条（宽屏侧栏 footer） ---------- */
.fs{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden;cursor:pointer;transition:border-color .15s ease,background .15s ease}
.fs:hover{border-color:var(--line-strong);background:var(--panel-muted)}
.fs-bar{height:2px;position:relative;overflow:hidden;background:var(--line);display:none}
.fs.connecting .fs-bar{display:block}
.fs-bar::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:fslide 1.2s ease-in-out infinite}
@keyframes fslide{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
.fs-l1{display:flex;align-items:center;gap:7px;padding:8px 10px 0;font-size:11.5px}
.fs-l1 .st{flex:none;width:7px;height:7px;border-radius:999px;background:color-mix(in srgb,var(--ink) 26%,transparent)}
.fs.ok .st{background:var(--green-dot)}
.fs.err .st{background:var(--red)}
.fs.warn .st{background:#f5a623}
.fs.connecting .st{width:12px;height:12px;border:1.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;background:none}
.fs .w{flex:none;font-weight:650;letter-spacing:0}
.fs.connecting .w{color:var(--accent)}
.fs.ok .w{color:var(--ink)}
.fs.err .w{color:var(--red)}
.fs.warn .w{color:var(--amber)}
.fs .nm{min-width:0;font-weight:500;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs .chev{margin-left:auto;flex:none;color:var(--ink-muted);font-size:8.5px;transition:transform .18s ease}
.fs:hover .chev{color:var(--ink)}
.fs.open .chev{transform:rotate(180deg)}
.fs-l2{display:flex;align-items:center;gap:6px;padding:3px 10px 9px;font-size:10px;color:var(--ink-muted);white-space:nowrap;overflow:hidden}
.fs-l2 .mono{font-family:var(--mono);font-size:9.5px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.fs-l2 a{color:var(--accent);font-weight:550;flex:none;cursor:pointer}
.fs-l2 .sp{width:9px;height:9px;border:1.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
/* 展开态 · 连接概览 */
.fs-open{padding:9px 10px 10px;display:flex;flex-direction:column;gap:7px}
.fs-open .hd{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:var(--ink-muted);font-weight:600}
.fs-open .hd .collapse{color:var(--accent);font-weight:550;cursor:pointer}
.fs-kv{display:grid;grid-template-columns:50px 1fr;gap:5px 8px;font-size:10.5px;align-items:baseline}
.fs-kv span{color:var(--ink-muted)}
.fs-kv b{font-weight:500;color:var(--ink);font-family:var(--mono);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs-kv b.sans{font-family:var(--font);font-size:10.5px}
.fs-open .acts{display:flex;gap:6px;padding-top:7px;border-top:1px dashed var(--line)}
/* 现状对照 */
.old-status{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:11px;color:var(--ink-soft);max-width:220px}
.old-status .st{width:6px;height:6px;border-radius:999px;background:#f5a623;flex:none}
.old-status .tx{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.old-status .dt{color:var(--accent);font-weight:550;flex:none}

/* 优化说明页 */
.chg{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.chg-item{display:grid;grid-template-columns:34px 170px 1fr;gap:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:13px 15px;align-items:start}
.chg-item .cn{font-family:var(--mono);font-size:10px;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 24%,transparent);background:var(--accent-soft);border-radius:999px;padding:2px 0;text-align:center;margin-top:1px}
.chg-item .ct b{display:block;font-size:12px;font-weight:650;margin-bottom:3px}
.chg-item .ct span{font-size:10px;color:var(--ink-muted)}
.chg-item p{font-size:11.5px;color:var(--ink-soft);line-height:1.7}
.chg-item p em{font-style:normal;color:var(--ink);font-weight:550}
</style>
</head>

<script>

  {g:"服务器",items:[{n:"127.31",ip:"192.168.127.31",p:22},{n:"127.32",ip:"192.168.127.32",p:22},{n:"2.90",ip:"192.168.2.90",p:22}]},

  {g:"生产",items:[{n:"2.150",ip:"192.168.2.150",p:22},{n:"2.151",ip:"192.168.2.151",p:22}]}
];
function sidebarHtml(){

/* ================= A-v2 组件 ================= */
function eyebrow(iconn,txt){return `<span class="wa-eyebrow rv d1">${ic(iconn,11)} ${txt}</span>`}
function step(n,{state="",cur=false,title,desc,btn}){

  return `<div class="wa-step${cur?" cur":""}">${num}<div class="wa-tx"><b>${title}</b><span>${desc}</span></div>${btn||`<span class="wa-arr">→</span>`}</div>`;
}
function steps(html){return `<div class="wa-steps rv d4">${html}</div>`}
function keys(html){return `<div class="wa-keys rv d5">${html}</div>`}
function panel(header,link,rows){return `<div class="wsp rv d6"><div class="wsp-h"><span>${header}</span>${link?`<a>${link}</a>`:""}</div>${rows}</div>`}

function wa(mainHtml,sideHtml,narrow){

function srvChip(on,name,host){return on
  ?`<span class="srv-chip"><i class="cdot"></i><span class="cname">${name}</span><span class="chost">${host}</span><span class="ccaret">▾</span></span>`
  :`<span class="srv-chip"><i class="cdot idle"></i><span class="cname">选择服务器</span><span class="ccaret">▾</span></span>`}
function spTabbar(tab,{disabled=false,term=true}={}){
  const t=(id,icon,label,dis)=>`<button class="sp-tab${tab===id?" on":""}"${dis?" disabled":""}><span class="ic">${ic(icon,15)}</span><span>${label}</span></button>`;
  let h=`<nav class="sp-tabbar">${t("log","file","日志",disabled)}${t("files","folder","文件",disabled)}`;
  if(term)h+=t("term","term","终端",disabled);
  return h+`</nav>`;
}
function frameNarrow(content,{chip,status,tab="files",tabDisabled=false,term=true,h=560}={}){
  return `<div class="app narrow" style="--fh:${h}px">
    <div class="main">
      <div class="sp-appbar"><button class="tbtn">${ic("cmd",13)}</button>${chip}</div>
      <div class="content">${content}</div>
    </div>
    ${spTabbar(tab,{disabled:tabDisabled,term})}
  </div>`;
}
function narrowWa({eyebrowI,eyebrowT,title,sub,stepsHtml,cta,chips,hint}){
  return `<div class="wa"><div class="wa-grid narrow">
    ${eyebrow(eyebrowI,eyebrowT)}
    <div class="wa-title rv d2">${title}</div>
    <p class="wa-sub rv d3">${sub}</p>
    ${steps(stepsHtml)}
    ${cta?`<div class="sp-cta rv d5">${cta}</div>`:""}
    ${chips?`<div class="wn-chips rv d5">${chips}</div>`:""}
    ${hint?`<div class="wn-hint rv d6">${hint}</div>`:""}
  </div></div>`;
}

  <div class="sec"><span class="no">09</span><b>小态全谱</b><span>12 处 · 两档规格：抽屉/面板档（26px tile + 按钮）与内联档（单行无按钮）</span></div>
  <div class="minis" style="grid-template-columns:repeat(4,1fr)">
    ${MINIS.map(m=>`<div class="mini"><div class="mini-h">${ic(m.icon,12)}${m.name}</div><div class="mini-b">${m.body}</div><div class="mini-cap">${m.cap}</div></div>`).join("")}
  </div>
  <div class="note" style="margin-top:14px"><b>小屏 / 小态规格总表：</b><br/>
  · <b>抽屉 / 面板档</b>（命令面板、抽屉、附着面板、图表）：26px 图标 tile + 标题 12px + 一句话 10.5px + 可选按钮 24px；可点行高 ≥32px（触达面积）；内容受限时按钮转全宽。<br/>
  · <b>内联档</b>（下拉、侧栏小列、对话框内嵌）：14px 裸图标 + 单行 10.5px，无按钮；宽度 <220px 时文字截断省略，hover 由宿主行承接。<br/>
  · 触屏宿主（SP / 移动档）一律隐藏键位行，捷径改为明链或并入状态条「详情」；<b>禁用 tab / 置灰入口本身也是空态文案的一部分</b>，必须让用户看懂「为什么灰」。<br/>
  · 覆盖场景：12 / 13 / 14 / 15 / 16 / 17 / 18 / 19 / 20 / 22 / 24 / 25（总账编号）。</div>`);

/* ---------- 10 · 底部状态条 ---------- */
function fsCard(state,{word,obj,l2,openHtml}={}){
  return `<div class="fs ${state}${openHtml?" open":""}">${openHtml||`
    <div class="fs-l1"><span class="st"></span><span class="w">${word}</span><span class="nm">${obj||""}</span><span class="chev">▾</span></div>
    <div class="fs-l2">${l2}</div>`}</div>`;
}
const FS_CARDS=[
  fsCard("idle",{word:"待命",l2:`选择服务器后自动连接`}),
  fsCard("connecting",{word:"连接中",obj:"",l2:`<span class="sp"></span><span class="mono">SSH 握手中 · 堡垒机-演示</span>`}),
  fsCard("ok",{word:"已连接",l2:`<span class="mono">堡垒机-演示 · /data/apps/logs</span>`}),
  fsCard("err",{word:"连接失败",l2:`<span class="mono">192.168.130.3 : 2222</span> 认证失败 · <a>重试</a>`}),
  fsCard("warn",{word:"服务离线",l2:`5s 后重试 · <span class="mono">127.0.0.1:7345</span> <a>检查</a>`})
];
const FS_OPEN=fsCard("ok",{openHtml:`<div class="fs-open">
    <div class="hd"><span>连接概览</span><span class="collapse">收起</span></div>
    <div class="fs-kv">
      <span>本地服务</span><b class="sans">运行中</b>
      <span>服务器</span><b class="sans">堡垒机-演示 · 已连接</b>
      <span>主机</span><b>deploy@192.168.130.3:2222</b>
      <span>路径</span><b>/data/apps/logs</b>
    </div>
    <div class="acts"><button class="btn sm">重新连接</button><button class="btn sm">连接设置</button></div>
  </div>`});
mount("s10",`
  <div class="sec"><span class="no">10</span><b>底部状态条 · 重设计</b><span>宽屏侧栏 footer（SidebarPanel compact-connection-card）</span></div>
  <div class="note"><b>现状问题（对照实装）：</b>${`<span class="old-status"><span class="st"></span><span class="tx">正在连接 堡垒机-演示…</span><span class="dt">详情</span></span>`}
  &nbsp;① 一行塞「名称 · 用户 · 路径」，198px 侧栏必截断成「正在连接 堡垒机-演示…」；② dot 只有绿 / 灰两态，连接中、失败、离线无法区分；③「详情」是孤立小字按钮，触达差；④ 展开后 4 行 label 密排，无动作。</div>

  <div class="sec"><span class="no">10.1</span><b>五态卡（真实 198px 侧栏宽度）</b><span>状态词固定 3-4 字永不截断，截断让给第二行</span></div>
  <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:12px">${FS_CARDS.map(c=>`<div>${c}</div>`).join("")}</div>
  <div class="cap"><b>两行结构：</b>L1 = 状态指示 + 状态词 + chevron；L2 = 对象 / 上下文（mono 只用于 host · path / 阶段），可截断。<b>语义五色：</b>灰待命 · 蓝连接中 · 绿已连接 · 红失败 · amber 离线。<b>连接中</b>卡片顶部有 2px 流光进度条（有生命感）；<b>失败 / 离线</b>在 L2 给 inline 动作（重试 / 检查），不用点开概览就能自救。</div>

  <div class="sec"><span class="no">10.2</span><b>展开态 · 连接概览</b><span>整卡可点，chevron 旋转；沿用现有 statusExpanded 记忆</span></div>
  <div style="max-width:240px;margin-top:12px">${FS_OPEN}</div>
  <div class="cap">概览改为 kv 网格（mono 值可截断）+ 底部动作行（重新连接 / 连接设置）；「收起」与整卡点击均可折叠。</div>

  <div class="sec"><span class="no">10.3</span><b>装回侧栏（连接中态 · 1:1）</b><span>服务器列表 → 状态卡 → 操作记录</span></div>
  <div style="margin-top:12px"><div class="app" style="--fh:500px">
    <div class="side">
      <div class="sb-head"><span class="tl r"></span><span class="tl y"></span><span class="tl g"></span><span class="gear">${ic("cmd",13,1.5)}${ic("clock",13,1.5)}</span></div>
      <div class="sb-title">日志控制台</div>
      <div class="sb-cap"><b>服务器</b><span>27 台</span></div>
      <div class="sb-search">${ic("search",11,1.6)}输入名称、分组或地址</div>
      <div class="sb-groups">${GROUPS.slice(0,3).map(g=>`<div class="sb-group">${g.g}</div>`+g.items.map(it=>`<div class="sb-item${it.n==="堡垒机-演示"?" on":""}"><div class="r1"><span class="nm"><i class="dot${it.on?"":" idle"}"></i><b>${it.n}</b></span><span class="pt">${it.p}</span></div><div class="r2">${it.ip}</div></div>`).join("")).join("")}</div>
      <div style="flex:none;padding:0 10px 8px">${fsCard("connecting",{word:"连接中",l2:`<span class="sp"></span><span class="mono">SSH 握手中 · 堡垒机-演示</span>`})}</div>
      <section style="flex:none;margin:0 10px 10px;border-top:1px solid var(--line);padding-top:8px">
        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--ink-muted);font-weight:600;padding:0 2px 6px"><span>操作记录</span><span>3 条</span></div>
        <div style="display:flex;flex-direction:column;gap:4px;font-size:10px;color:var(--ink-muted)">
          <span style="font-family:var(--mono);font-size:9.5px">19:13:02 已载入 27 台服务器</span>
          <span style="font-family:var(--mono);font-size:9.5px">19:13:05 正在连接 堡垒机-演示…</span>
          <span style="font-family:var(--mono);font-size:9.5px">19:13:05 SSH 握手中</span>
        </div>
      </section>
    </div>
    <div class="main"><div class="tbar">${topbarHtml("files")}</div><div class="content">${wa(S2_MAIN,null)}</div></div>
  </div></div>
  <div class="cap">与内容区联动：连接中时内容区是进度工作台（02 屏），底部卡同步 spinner 与阶段词；连接完成后卡片转绿、L2 换 host · 路径，全程无截断。</div>
  <div class="note" style="margin-top:10px"><b>落地映射：</b>收起态 = 重写 sidebar-status-summary 为两行结构；展开态 = 沿用 statusExpanded，概览改 kv 网格 + 动作行；状态源已有（isBusy / connectionTestStatus / showServiceOfflineState / hasDirectoryConnectionError），只需映射到五态 class；进度条为纯 CSS 动画，reduced-motion 下退化为静态 2px 强调色条。</div>`);

/* 导航 / 暗色 / hash */
const NAVDESC={
  s0:["00 优化说明","方案 A v2 相对 v1 的 8 个优化点"],
  s1:["01 等待选择服务器","双栏：步骤时间线 + 最近连接情境面板"],
  s2:["02 连接中 · 进度态","spinner 节点 + mono 实时状态行 + 取消"],
  s3:["03 检索空态","右栏 = 最近检索（命中数 / 时间 / 重新检索）"],
  s4:["04 终端 · 无会话","右栏 = 最近会话，一键重开"],
  s5:["05 目录为空","右栏 = 常用位置一键跳转"],
  s6:["06 还没有服务器","右栏 = 导入来源；侧栏同步空态"],
  s7:["07 服务离线","步骤等待态 + 右栏服务诊断"],
  s8:["08 SP 移动档 · 三视图","srv-chip + 全宽主按钮 + tabbar 禁用态 · 真实 ≤560px 结构"],
  s9:["09 小态全谱","12 处两档规格：抽屉/面板档（tile+按钮）与内联档（单行）"],
  s10:["10 底部状态条","五态卡：状态词不截断 · 语义五色 · 展开概览 kv 网格"]
};
document.querySelectorAll("#index button").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll("#index button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("on"));
    document.getElementById(b.dataset.page).classList.add("on");
    const d=NAVDESC[b.dataset.page];
    document.getElementById("desc-n").textContent=d[0];
    document.getElementById("desc-d").textContent=d[1];
    document.getElementById("viewport").scrollTop=0;
  });
});
document.querySelectorAll("#skin-toggle button").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll("#skin-toggle button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    document.getElementById("viewport").classList.toggle("dark",b.dataset.skin==="dark");
  });
});
(function(){
  const h=location.hash.replace("#","");
  if(!h)return;
  const [pg,skin]=h.split("-");
  const nav=document.querySelector(`#index button[data-page="${pg}"]`);
  if(nav)nav.click();
  if(skin==="dark")document.querySelector('#skin-toggle button[data-skin="dark"]').click();
})();
</script>
</body>
</html>
