<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340">
  <defs>
    <style>
      .label{font:600 18px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#1f2937}
      .sub{font:400 13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#64748b}
      .card{fill:#fff;stroke:#e5e7eb;stroke-width:1}
      .menubar{fill:#6f6ccf}
      .slot{fill:rgba(255,255,255,.12)}
    </style>
    <mask id="smooth-square-cutout">
      <rect width="22" height="22" fill="#fff"/>
      <path d="M7.0 7.15 C8.1 8.05 9.08 9.02 10.1 10.18 C9.08 11.36 8.1 12.35 7.0 13.25" fill="none" stroke="#000" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12.15 13.18 H15.78" fill="none" stroke="#000" stroke-width="2.1" stroke-linecap="round"/>
    </mask>
    <mask id="sharp-square-cutout">
      <rect width="22" height="22" fill="#fff"/>
      <path d="M6.4 8.55 9 11 6.4 13.45" fill="none" stroke="#000" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M10.9 13.4h4.2" fill="none" stroke="#000" stroke-width="1.9" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect width="820" height="340" fill="#f8fafc"/>
  <text x="34" y="36" class="label">方案 8：圆角方形 + 柔顺镂空 &gt;_</text>
  <text x="34" y="58" class="sub">外框回到四角圆角方形，内部符号保留 Codex 式圆润感，不做云朵边。</text>
  <rect x="34" y="80" width="752" height="42" rx="10" class="menubar"/>
  <g transform="translate(114 90)">
    <rect x="-9" y="-5" width="40" height="30" rx="7" class="slot"/>
    <svg x="0" y="0" width="22" height="22" viewBox="0 0 22 22">
      <rect x="3.45" y="4.55" width="15.1" height="12.9" rx="3.35" fill="#fff" mask="url(#smooth-square-cutout)"/>
    </svg>
  </g>
  <g transform="translate(274 90)">
    <rect x="-9" y="-5" width="40" height="30" rx="7" class="slot"/>
    <svg x="0" y="0" width="22" height="22" viewBox="0 0 22 22">
      <rect x="3.4" y="5" width="15.2" height="12" rx="2.3" fill="#fff" mask="url(#sharp-square-cutout)"/>
    </svg>
  </g>
  <g transform="translate(434 90)">
    <rect x="-9" y="-5" width="40" height="30" rx="7" class="slot"/>
    <svg x="0" y="0" width="22" height="22" viewBox="0 0 22 22">
      <path d="M5.4 6.8 9.7 11 5.4 15.2" fill="none" stroke="#fff" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12.1 14.6h5.1" fill="none" stroke="#fff" stroke-width="2.15" stroke-linecap="round"/>
    </svg>
  </g>
  <g transform="translate(82 150)">
    <rect width="190" height="150" rx="16" class="card"/>
    <text x="95" y="28" text-anchor="middle" class="label">新版方案 8</text>
    <text x="95" y="48" text-anchor="middle" class="sub">圆角方形 + 柔顺</text>
    <svg x="51" y="58" width="88" height="88" viewBox="0 0 22 22">
      <rect x="3.45" y="4.55" width="15.1" height="12.9" rx="3.35" fill="#111827" mask="url(#smooth-square-cutout)"/>
    </svg>
  </g>
  <g transform="translate(315 150)">
    <rect width="190" height="150" rx="16" class="card"/>
    <text x="95" y="28" text-anchor="middle" class="label">对照：尖角版</text>
    <text x="95" y="48" text-anchor="middle" class="sub">普通终端感更强</text>
    <svg x="51" y="58" width="88" height="88" viewBox="0 0 22 22">
      <rect x="3.4" y="5" width="15.2" height="12" rx="2.3" fill="#111827" mask="url(#sharp-square-cutout)"/>
    </svg>
  </g>
  <g transform="translate(548 150)">
    <rect width="170" height="150" rx="16" fill="#111827"/>
    <text x="85" y="126" text-anchor="middle" class="sub" fill="#cbd5e1">暗底 44px 模拟</text>
    <svg x="63" y="44" width="44" height="44" viewBox="0 0 22 22">
      <rect x="3.45" y="4.55" width="15.1" height="12.9" rx="3.35" fill="#fff" mask="url(#smooth-square-cutout)"/>
    </svg>
  </g>
</svg>
